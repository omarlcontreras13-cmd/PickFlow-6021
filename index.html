// Lazy-load pdf.js (manifest PDFs are real text — no OCR needed)
let _trPdfReady = null;
function ensurePdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (_trPdfReady) return _trPdfReady;
  _trPdfReady = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => {
      try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; } catch (e) {}
      resolve(window.pdfjsLib);
    };
    s.onerror = () => reject(new Error('Could not load pdf.js (check internet connection)'));
    document.head.appendChild(s);
  });
  return _trPdfReady;
}

function trFrac(s) {
  s = (s || '').trim();
  let m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/); if (m) return +m[1] + (+m[2]) / (+m[3]);
  m = s.match(/^(\d+)\/(\d+)$/); if (m) return (+m[1]) / (+m[2]);
  const f = parseFloat(s); return isNaN(f) ? 0 : f;
}

// Reconstruct text lines from a PDF (group by y, sort by x) — mirrors pdfplumber/engine
async function trExtractPdfLines(arrayBuffer) {
  const pdfjsLib = await ensurePdfJs();
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer) }).promise;
  const lines = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const tc = await (await pdf.getPage(i)).getTextContent();
    const rows = [];
    tc.items.forEach(it => {
      if (!it.str || !it.str.trim()) return;
      const y = Math.round(it.transform[5]);
      let row = rows.find(r => Math.abs(r.y - y) <= 2);
      if (!row) { row = { y, items: [] }; rows.push(row); }
      row.items.push({ x: it.transform[4], s: it.str });
    });
    rows.sort((a, b) => b.y - a.y).forEach(r => {
      const line = r.items.sort((a, b) => a.x - b.x).map(o => o.s).join(' ').replace(/\s+/g, ' ').trim();
      if (line) lines.push(line);
    });
  }
  return lines;
}

// Parse the shipping manifest (rpt020): per order-item attrs + roll→lead map
function trParseManifest(lines) {
  let load = null, veh = null, cur = null, wantPart = false;
  const ois = {}, order = [], rl = {}, ro = {};
  const OI  = /^([A-Z0-9]+-\d{2})\s+(.+?)\s+(\d+(?:\s+\d+\/\d+)?)\s+in\s+(\d+(?:\s+\d+\/\d+)?)\s+in$/;
  const ROW = /^(MD\w+)\s+(\d+)\s+(MD\w+)\s/;
  lines.forEach(line => {
    let m = line.match(/LOAD\s+(MD\w+)\s+CARRIER/); if (m) load = m[1];
    m = line.match(/VEHICLE NO\.\s+(\S+)/); if (m) veh = m[1];
    m = line.match(OI);
    if (m) {
      const oi = m[1]; cur = oi;
      if (!ois[oi]) { ois[oi] = { oi, desc: m[2].trim(), width: trFrac(m[3]), diam: trFrac(m[4]), part: null, po: null, ordno: oi.replace(/-\d+$/, '') }; order.push(oi); }
      wantPart = false; return;
    }
    if (line.indexOf('CUSTOMER PART NUMBER') >= 0) { wantPart = true; return; }
    if (wantPart && cur && line && !ois[cur].part) { ois[cur].part = line.split(/\s+/)[0]; wantPart = false; }
    m = line.match(ROW);
    if (m && cur) { rl[m[1]] = m[3]; ro[m[1]] = cur; }
  });
  // PO pass: "MD <ordno> <customer order>" → match by derived ord no
  lines.forEach(line => {
    const m = line.match(/\bMD\s+(\S+)\s+(.+?)\s*$/);
    if (m) order.forEach(oi => { if (ois[oi].ordno === m[1] && !ois[oi].po) ois[oi].po = m[2].trim(); });
  });
  return { load, veh, ois, order, rl, ro };
}

// Parse the Straight Bill of Lading (rpt040): load-level totals for cross-checking
function trParseBOL(lines) {
  const txt = lines.join(' ');
  const out = { rolls: null, wt: null, deliv: null };
  let m = txt.match(/Total:\s*([\d,]+)\s*Rolls\s*([\d,]+)\s*LB/i);
  if (m) { out.rolls = parseInt(m[1].replace(/,/g, ''), 10); out.wt = parseInt(m[2].replace(/,/g, ''), 10); }
  m = txt.match(/DELIVERY DATE:\s*(\d{1,2}-[A-Za-z]{3}-\d{2,4})/i);
  if (m) out.deliv = m[1];
  return out;
}

// Parse the FRAPAP roll list: PO#, ITEM#(BWT-WIDTH), ROLL ID, WT, LF, DIA, SID
function trParseExcel(arrayBuffer) {
  const wb = XLSX.read(new Uint8Array(arrayBuffer), { type: 'array' });
  const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
  const ex = {};
  for (let i = 1; i < aoa.length; i++) {
    const r = aoa[i]; if (!r || !r[2]) continue;
    ex[String(r[2]).trim()] = {
      wt: parseFloat(r[3]) || 0, lf: parseFloat(r[4]) || 0,
      width: parseFloat(String(r[1]).split('-')[1]) || 0
    };
  }
  return ex;
}

// Join + collapse by LEAD ROLL ID → one row per pack
function trBuildLoad(parsed, ex) {
  const { load, veh, ois, order, rl, ro } = parsed;
  const packs = {}, packOrder = [];
  Object.keys(ex).forEach(rid => {
    const lead = rl[rid], oi = ro[rid];
    if (!lead) return;
    let p = packs[lead];
    if (!p) { p = packs[lead] = { lead, oi, wt: 0, lf: 0, pcs: 0, width: ex[rid].width }; packOrder.push(lead); }
    p.wt += ex[rid].wt; p.lf += ex[rid].lf; p.pcs++;
  });
  const rows = packOrder.map(lead => {
    const p = packs[lead], o = ois[p.oi] || {};
    return {
      sku: o.part || '', productId: TR_TABLE[String(o.part || '').trim()] || o.desc || '',
      lot: lead, prodId2: p.oi || '', po: o.po || '',
      weight: Math.round(p.wt), lf: Math.round(p.lf), pcs: p.pcs, width: p.width || 0
    };
  });
  const ordnos = [...new Set(order.map(oi => ois[oi].ordno))].join(', ');
  return { load, vehicle: veh, ordnos, rows, rollCount: Object.keys(ex).length, packCount: rows.length };
}

// Build the 12-column EDI export sheet (same template as HBH/Sci; Exp Date = today)
function buildEDISheet_TwinRivers(load) {
  const aoa = [
    [],
    ['Receiver', load.load, null, 'Total Rolls', load.rows.length, null, null, 'Fraction  Decimal'],
    ['PO #', 'TWIN RIVERS ' + load.load + (load.vehicle ? ' ' + load.vehicle : ''), null, null, null, null, null, 0.5, 0.5],
    ['Invoice #', load.ordnos],
    ['Truck #', load.vehicle || '', null, null, null, null, null, 'Piper IBD Order #'],
    [], [],
    ['SKU','Product ID','Lot#','Prod ID 2','PO#','Weight','Gross Weight','UOM','LF','Pcs','Width','Exp Date']
  ];
  const _now = new Date();
  const fileDateSerial = Math.round(Date.UTC(_now.getFullYear(), _now.getMonth(), _now.getDate()) / 86400000) + 25569;
  load.rows.forEach(r => {
    aoa.push([r.sku, r.productId, r.lot, r.prodId2, r.po, r.weight, r.weight, 'ROLLS', r.lf, r.pcs, r.width, fileDateSerial || '']);
  });
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  for (let ri = 8; ri < aoa.length; ri++) {
    const ref = XLSX.utils.encode_cell({ r: ri, c: 11 });
    if (ws[ref] && ws[ref].v) { ws[ref].t = 'n'; ws[ref].z = 'm/d/yyyy'; }
  }
  return ws;
}

function exportSingleTR(key) {
  const load = (window._ediTRLoads || {})[key];
  if (!load || !load.rows.length) return;
  const wb = XLSX.utils.book_new();
  const ws = buildEDISheet_TwinRivers(load);
  const safeName = String(load.load).substring(0, 31);
  XLSX.utils.book_append_sheet(wb, ws, safeName);
  XLSX.writeFile(wb, 'EDI_TwinRivers_' + safeName + '.xlsx');
  window._ediTRStamps = window._ediTRStamps || {};
  window._ediTRStamps[key] = { exportedAt: Date.now(), exportedBy: state.currentUser || '' };
  showAlert('✓ Exported EDI_TwinRivers_' + safeName + '.xlsx', 'success');
  showEDIImportFile();
}

function deleteTRLoad(key) {
  if (window._ediTRLoads) delete window._ediTRLoads[key];
  _ediSave();
  showEDIImportFile();
}

// Multi-file ingest: FRAPAP Excel(s) + manifest PDF(s); BOL (rpt040) is ignored
async function processTRFiles(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  // Standard Twin Rivers set: Straight Bill of Lading + Shipping Manifest + FRAPAP Excel.
  // Stage files so they can be dropped together OR one at a time.
  const pend = window._ediTRPending = window._ediTRPending || { excels: [], pdfs: [] };
  const ignored = [];
  files.forEach(f => {
    if (/\.xls[xmb]?$/i.test(f.name)) { if (!pend.excels.some(x => x.name === f.name)) pend.excels.push(f); }
    else if (/\.pdf$/i.test(f.name)) { if (!pend.pdfs.some(x => x.name === f.name)) pend.pdfs.push(f); }
    else ignored.push(f.name);
  });
  if (ignored.length) showAlert('Twin Rivers: ignored (need .xls/.xlsx or .pdf): ' + ignored.join(', '), 'warning');

  // Wait until the Excel and BOTH PDFs (Bill of Lading + Shipping Manifest) are staged
  if (!pend.excels.length || pend.pdfs.length < 2) {
    showEDIImportFile(); // refresh dropzone so it shows what's staged
    const needs = [];
    if (!pend.excels.length) needs.push('the FRAPAP Excel');
    if (pend.pdfs.length < 2) needs.push((2 - pend.pdfs.length) + ' more PDF (Bill of Lading + Shipping Manifest)');
    showAlert('Twin Rivers: staged ' + pend.excels.length + ' Excel + ' + pend.pdfs.length + ' PDF — still need ' + needs.join(' and ') + '.', 'info');
    return;
  }

  showAlert('Reading Twin Rivers load…', 'info');
  try {
    const ex = {};
    for (const f of pend.excels) { Object.assign(ex, trParseExcel(await f.arrayBuffer())); }
    let parsed = null, bol = null;
    for (const f of pend.pdfs) {
      const lines = await trExtractPdfLines(await f.arrayBuffer());
      const isManifest = lines.some(l => /Shipping Manifest/i.test(l)) || lines.some(l => /^MD\w+\s+\d+\s+MD\w+/.test(l));
      const isBOL = !isManifest && lines.some(l => /BILL OF LADING/i.test(l));
      if (isManifest) {
        const p = trParseManifest(lines);
        if (!parsed) parsed = p;
        else {
          Object.assign(parsed.ois, p.ois); Object.assign(parsed.rl, p.rl); Object.assign(parsed.ro, p.ro);
          p.order.forEach(o => { if (parsed.order.indexOf(o) < 0) parsed.order.push(o); });
        }
      } else if (isBOL) {
        bol = trParseBOL(lines);
      }
    }
    if (!parsed) { showAlert('Twin Rivers: the Shipping Manifest (rpt020) wasn’t found among the PDFs — add it.', 'warning'); return; }
    if (!bol)    { showAlert('Twin Rivers: the Straight Bill of Lading (rpt040) wasn’t found among the PDFs — add it.', 'warning'); return; }
    const built = trBuildLoad(parsed, ex);
    if (!built.load) { showAlert('Twin Rivers: could not read the LOAD number from the manifest PDF.', 'warning'); return; }
    if (!built.rows.length) { showAlert('Twin Rivers: 0 rolls matched between the Excel and the manifest — check both are for the same load.', 'warning'); return; }
    // Cross-check the build against the Bill of Lading totals
    const sumWt = built.rows.reduce((s, r) => s + (r.weight || 0), 0);
    let xchk = '';
    if (bol.rolls != null) {
      const rollsOk = bol.rolls === built.rollCount;
      const wtOk = bol.wt == null || Math.abs(bol.wt - sumWt) <= Math.max(5, bol.wt * 0.001);
      xchk = (rollsOk && wtOk) ? ' (matches BOL)' : ' ⚠ BOL: ' + bol.rolls + ' rolls / ' + (bol.wt != null ? bol.wt.toLocaleString() + ' lb' : '?');
    }
    built.bol = bol;
    window._ediTRLoads = window._ediTRLoads || {};
    window._ediTRLoads[built.load] = built;
    _ediSave();
    window._ediTRPending = { excels: [], pdfs: [] }; // clear staging on success
    showAlert('✓ Twin Rivers ' + built.load + ' — ' + built.rollCount + ' rolls → ' + built.packCount + ' packs' + xchk, 'success');
    showEDIImportFile();
  } catch (e) {
    showAlert('Twin Rivers parse error: ' + (e && e.message ? e.message : e), 'danger');
  }
}
function handleTRDrop(e)   { processTRFiles(e.dataTransfer.files); }
function handleTRUpload(e) { processTRFiles(e.target.files); }

// ─── UPM DELIVERY NOTE / BOL → LOAD ───────────────────────────────────────────
// One UPM Delivery Note PDF = one load. Text-layer parse via trExtractPdfLines
// (shared pdf.js extractor). Multiple SKUs (delivery-note pages) supported; each
// roll carries its own SKU / Prod ID 1 / Prod ID 2 / line PO. Field map:
//   Mill order number ........ SKU
//   Shipping marks ........... Prod ID 1  (Product ID column)
//   "ATL UPM " + Order number  Prod ID 2
//   Package Number (UPT id) .. Lot #
//   Gross weight ............. Weight   (KG→LBS ×2.20462 only when BOL is metric)
//   Metres ................... LF       (m→ft ×3.28084 only when BOL is metric)
//   Customer PO .............. per-line PO#
//   Vehicle ID ............... Truck #
//   UPM Ref. number .......... header PO #   (NOT the line-item Customer PO)
// Units auto-detected (metric: "kg kg" + "Metres"; imperial: "lb lb" + "LF/Feet").
// Per-load toggles let the user override. Reel width mm→in. Rolls + gross
// reconciled against the printed page totals (raw units, so unit-agnostic).
const UPM_MM2IN = 0.0393701, UPM_M2FT = 3.28084;
function _upmWeight(raw, isKg){ return Math.round((isKg ? raw * CAT_KG2LB : raw) || 0); }
function _upmLF(raw, isM){ return Math.round((isM ? raw * UPM_M2FT : raw) || 0); }
// Override-aware display: a manually-edited cell (ovrWt/ovrLF) wins over the computed value.
function _upmWeightRow(r, isKg){ return (r && r.ovrWt!=='' && r.ovrWt!=null) ? Math.round(_ediNum(r.ovrWt)||0) : _upmWeight(r?r.rawWeight:0, isKg); }
function _upmLFRow(r, isM){ return (r && r.ovrLF!=='' && r.ovrLF!=null) ? Math.round(_ediNum(r.ovrLF)||0) : _upmLF(r?r.rawLength:0, isM); }
// ─── EDI DETAIL INLINE EDITING ────────────────────────────────────────────────
// Makes every attribute in the expanded EDI detail tables editable (LOT # stays
// read-only). Edits write straight to the load row, save + sync (shared), and the
// value flows into Export. Computed columns (UPM weight/LF, Catalyst weight/LF/
// width) get a per-row override the export/render honors instead of recomputing.
// Nothing else about the EDI generators changes.
function _ediCellInput(genKey, a, b, field, value, opts){
  opts = opts || {};
  const esc = String(value==null?'':value).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
  const align = opts.num ? 'right' : 'left';
  const w = opts.width || (opts.num ? '78px' : '100%');
  // Build call args safely for an HTML attribute (single-quoted JS strings, quotes escaped).
  function jsArg(v){ if (typeof v==='number') return String(v); return "'"+String(v).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/&/g,'&amp;').replace(/"/g,'&quot;')+"'"; }
  const args = "'"+genKey+"',"+jsArg(a)+","+(b==null?'null':jsArg(b))+",'"+field+"',this.value";
  // onchange re-renders (recompute totals + honor overrides); oninput keeps the value hot.
  return '<input value="'+esc+'"'
    +' oninput="_ediSetCell('+args+',false)"'
    +' onchange="_ediSetCell('+args+',true)"'
    +' spellcheck="false"'
    +' style="width:'+w+';box-sizing:border-box;background:var(--bg);border:1px solid var(--border);border-radius:4px;'
    +'padding:2px 5px;color:var(--text);font-family:var(--font);font-size:10px;text-align:'+align+';outline:none">';
}
// numeric string -> number (strips commas); '' stays ''
function _ediNum(v){ if(v===''||v==null) return ''; const n=parseFloat(String(v).replace(/,/g,'')); return isNaN(n)?'':n; }
function _ediRerender(genKey){
  if (genKey==='upm')      showEDIImportFile();
  else if (genKey==='domtar') showEDIImportFile();
  else if (genKey==='hbh') showEDIImportFile();
  else if (genKey==='ipg') { if (typeof renderIPGLoads==='function') renderIPGLoads(); }
  else if (genKey==='cat') { if (typeof renderCatalystLoads==='function') renderCatalystLoads(); }
  else if (genKey==='tr')  showEDIImportFile();
}
// Reopen the detail panel that was open, since a full re-render collapses it.
function _ediReopenDetail(detailId){
  if (!detailId) return;
  setTimeout(function(){
    const el=document.getElementById(detailId); const btn=document.getElementById(detailId+'-btn');
    if (el){ el.style.display='block'; if(btn) btn.textContent='▲'; }
  }, 0);
}
function _ediSetCell(genKey, a, b, field, value, commit){
  let row=null, load=null, detailId='';
  if (genKey==='upm'){ load=(window._upmLoads||[])[a]; if(load){ row=(load.rows||[])[b]; detailId='upm-detail-'+a; } }
  else if (genKey==='domtar'){ load=(window._domtarLoads||[])[a]; if(load){ row=(load.rows||[])[b]; detailId='domtar-detail-'+a; } }
  else if (genKey==='hbh'){ load=(_ediHBHLoads||[])[a]; if(load){ row=(load.rows||[])[b]; detailId='hbh-detail-'+a; } }
  else if (genKey==='ipg'){ load=(_ipgLoads||[])[a]; if(load){ row=(load.rolls||[])[b]; detailId='ipg-detail-'+a; } }
  else if (genKey==='cat'){ load=(_catLoads||[])[a]; if(load){ row=(load.lines||[])[b]; detailId='cat-detail-'+a; } }
  else if (genKey==='tr'){ load=(window._ediTRLoads||{})[a]; if(load){ row=(load.rows||[])[b]; detailId='tr-detail-'+String(a).replace(/[^a-zA-Z0-9_-]/g,'_'); } }
  if (!row) return;
  const numeric = { lf:1, weight:1, wt:1, width:1, widthNum:1, pcs:1, ovrLF:1, ovrWt:1, ovrWidth:1, adwt:1, widthIn:1 };
  row[field] = numeric[field] ? _ediNum(value) : value;
  // keep the two IPG order fields in step (detail shows SOM ORDER, export uses custOrder)
  if (genKey==='ipg' && field==='custOrder') row.somOrder = value;
  if (!commit) return;              // still typing — don't re-render yet
  try { _ediSaveEDI(); } catch(e){}  // persist + shared sync
  _ediRerender(genKey);
  _ediReopenDetail(detailId);
}
// One place to persist whichever sync layer exists in this build.
function _ediSaveEDI(){ if (typeof _ediSave==='function') _ediSave(); }
// Catalyst display honors a manual override (ovrWt/ovrLF/ovrWidth) over the raw*factor value.
function _catWtRow(L, wf){ return (L && L.ovrWt!=='' && L.ovrWt!=null) ? (_ediNum(L.ovrWt)||0) : (L.rawWeight*wf); }
function _catLFRow(L){ return (L && L.ovrLF!=='' && L.ovrLF!=null) ? (_ediNum(L.ovrLF)||0) : (L.linealCm*CAT_CM2IN); }
function _catWidthRow(L){ return (L && L.ovrWidth!=='' && L.ovrWidth!=null) ? (_ediNum(L.ovrWidth)||0) : (L.widthCm*CAT_CM2IN); }
function handleUPMDrop(e){ e.preventDefault(); _upmRoute(Array.from((e.dataTransfer&&e.dataTransfer.files)||[])); }
function handleUPMUpload(e){ _upmRoute(Array.from(e.target.files||[])); }
async function _upmRoute(files){
  const pdfs = files.filter(f => /\.pdf$/i.test(f.name));
  if (!pdfs.length){ showAlert('UPM: drop a Delivery Note / BOL .pdf', 'warning'); return; }
  for (const f of pdfs){
    try { await processUPMPDF(f); }
    catch (err){ console.error(err); showAlert('UPM: could not read ' + f.name + ' — ' + ((err&&err.message)||err), 'danger'); }
  }
}
async function processUPMPDF(file){
  showAlert('Reading UPM PDF…', 'info');
  let lines = await trExtractPdfLines(await file.arrayBuffer());
  let src = 'text', ocrReels = null;
  const hasPkg = (lines||[]).some(l => /^UP[A-Z0-9]{5,}\s+\d/i.test(l));
  if (!hasPkg){
    showAlert('UPM PDF has no text layer — running OCR (first run downloads the engine, give it a moment)…', 'info');
    const ocr = await _upmOcrPdf(await file.arrayBuffer());
    lines = ocr.lines; ocrReels = ocr.reels;
    src = 'ocr';
  }
  const load = _upmParse(lines, file.name, ocrReels);
  load.source = src;
  if (!load.rows.length){ showAlert('UPM: no packages found in ' + file.name + (src==='ocr'?' (OCR could not read the table — check scan quality).':' (is this a UPM Delivery Note?)'), 'warning'); return; }
  window._upmLoads = window._upmLoads || [];
  window._upmLoads.push(load);
  _ediSave();
  showEDIImportFile();
  const skuN = new Set(load.rows.map(r => r.sku)).size;
  const uStr = (load.weightIsKg ? 'KG→LBS' : 'LBS as-is') + ' · ' + (load.lengthIsMeters ? 'm→LF' : 'LF as-is');
  showAlert('✓ UPM ' + file.name + (src==='ocr'?' (OCR)':'') + ' — ' + load.rows.length + ' rolls · ' + skuN + ' SKU(s) · ' + uStr + (load.reconciled ? '' : ' · ⚠ verify roll weights vs BOL'), load.reconciled ? 'success' : 'warning');
}
function _upmNum(s){ return parseFloat(String(s==null?'':s).replace(/,/g,'')) || 0; }
// Reel width from the 'Basis weight / Reel width / Diameter / Core' table. Reel
// width is the first mm/in dimension on the value row; mm converts to inches,
// inches are left as-is. Returns '' when no dimension is present.
function _upmWidthIn(s){
  const mmm = String(s).match(/(\d[\d.]*)\s*mm\b/i);
  if (mmm) return +(_upmNum(mmm[1]) * UPM_MM2IN).toFixed(2);
  const inn = String(s).match(/(\d[\d.]*)\s*in\b/i);
  if (inn) return +_upmNum(inn[1]).toFixed(2);
  return '';
}
function _upmParse(lines, fileName, ocrReels){
  const isOcr = !!(ocrReels && ocrReels.length);
  const hdr = { receiver:'', poNum:'', truck:'' };
  const cur = { sku:'', prod1:'', prod2:'', linePo:'', order:'', widthIn:'', shipMark:'' };
  const rows = [];
  let pend = false, pendWidth = 0;
  const blob = (lines||[]).join(' ');
  // Unit system: metric (kg + Metres) converts; imperial (lbs + Web Length/ft) is left as-is.
  const metricScore   = (/\bG\/M2\b/i.test(blob)?1:0) + (/Metres|Meters/i.test(blob)?1:0) + (/\d\s*mm\b/i.test(blob)?1:0) + (/\bkg\b/i.test(blob)?1:0);
  const imperialScore = (/Web Length/i.test(blob)?1:0) + (/\bft2?\b/i.test(blob)?1:0) + (/\blbs?\b|lb\.|Ibs/i.test(blob)?1:0) + (/\d\s*in\b/i.test(blob)?1:0);
  const imperial = imperialScore > metricScore;
  const weightIsKg = !imperial, lengthIsMeters = !imperial;
  const isPkgRow = ln => /^UP[A-Z0-9]{5,}\b/i.test(ln) && (ln.match(/\d[\d,]*/g)||[]).length >= 2;
  (lines||[]).forEach(function(ln){
    let m;
    m = ln.match(/Loading ID\s+([A-Za-z0-9_]+)/i); if (m && !hdr.receiver) hdr.receiver = m[1];
    m = ln.match(/Ref\.?\s*number\s+(\d{4,})/i);    if (m && !hdr.poNum)    hdr.poNum    = m[1];
    m = ln.match(/Vehicle\s*ID\s+([A-Za-z0-9]{4,})/i); if (m && !hdr.truck) hdr.truck = m[1];
    // OCR often splits the Carrier | Vehicle-ID columns onto separate lines, so the
    // plate lands beside "…LLC ID 907305" or on a line of its own — capture those too.
    if (!hdr.truck){ m = ln.match(/(?:LLC|Carrier|Vehicle)[^0-9]*\bID\b[^0-9]{0,4}(\d{5,7})\b/i); if (m) hdr.truck = m[1]; }
    if (!hdr.truck && /^\s*\d{6}\s*$/.test(ln) && !hdr.truckMaybe) hdr.truckMaybe = ln.trim();
    // Shipping marks -> Prod ID 1 (e.g. "A018627"): a single letter followed by 6 digits.
    if (!cur.shipMark && !/^UP/i.test(ln.trim())){ m = ln.match(/\b([A-Z]\d{6})\b/); if (m) cur.shipMark = m[1]; }
    m = ln.match(/Customer PO\s+(.+?)(?:\s+Delivery reference|\s+reference|$)/i); if (m) cur.linePo = m[1].trim();
    if (/Order number\s+Quality\s+Shipping marks/i.test(ln)){ pend = true; return; }
    if (pend && !isPkgRow(ln)){
      pend = false;
      const toks = ln.split(/\s+/).filter(Boolean);
      cur.order = toks[0] || '';
      cur.prod2 = ('ATL UPM ' + cur.order).trim();
      let mk = toks[toks.length - 1] || '';
      if (!/^[A-Za-z]\d+/.test(mk)) mk = cur.linePo ? cur.linePo.split('/')[0].trim() : mk;
      cur.prod1 = mk;
    }

// ═══ DOMTAR PULP ROLL PACKING SLIP → LOAD ═══════════════════════════════════
// One packing slip = one load. Rolls ship as 2-roll PACKS (parent bold, child next);
// packs are kept together (parent line immediately followed by its child) through the
// grid and the export so labels print 2-per-pack under the right combo. Field map:
//   Load Number ........... Receiver (header)
//   Order-Item + Vehicle .. PO # (header)
//   Bill Of Lading ........ Invoice # (header)
//   Vehicle ID ............ Truck # (header)
//   SKU (typed) ........... SKU        → Product ID auto-fills from the SKU master
//   Roll ID (DTA…) ........ Lot #      (parent → child order)
//   Order-Item ............ Prod ID 2
//   Customer PO ........... PO # (line)
//   ADWT lbs .............. Weight & Gross Weight
//   Length ft ............. LF · Width in .. Width · Pcs = 1 · UOM = ROLL
//   Exp Date .............. day-of (Short Date), like the other segments
const DOMTAR_SKU_DEFAULT = { "WP3446": "ASH-A1-ADSWR7B-3IN-117-HVY2---60.90*152.00-R" };
// SKU master: built-in defaults + any imported/manually-added rows (Firebase 6021/domtarSku).
function getDomtarSkuTable(){
  const merged = {}; for (const k in DOMTAR_SKU_DEFAULT) merged[k] = DOMTAR_SKU_DEFAULT[k];
  const imp = (typeof state!=='undefined' && state.domtarSku) ? state.domtarSku : null;
  if (imp){ const recs = Array.isArray(imp) ? imp : Object.values(imp);
    recs.forEach(function(r){ if (r && r.sku!=null && String(r.sku).trim()) merged[String(r.sku).trim().toUpperCase()] = String(r.prod==null?'':r.prod); }); }
  return merged;
}
function _domtarProdId(sku){ const t = getDomtarSkuTable(); return t[String(sku==null?'':sku).trim().toUpperCase()] || ''; }
function _domtarSkuRecords(){ const imp = (typeof state!=='undefined' && state.domtarSku) ? state.domtarSku : null; return imp ? (Array.isArray(imp)?imp.slice():Object.values(imp)) : []; }
function _domtarNum(s){ const n = parseFloat(String(s==null?'':s).replace(/,/g,'')); return isNaN(n) ? 0 : n; }

// ── Word/table reconstruction (shared by the digital text layer and OCR) ───────
function _domtarRows(words){
  const rows = [];
  (words||[]).forEach(function(w){ let r = rows.find(function(r){ return Math.abs(r.y - w.y) <= 3; }); if (!r){ r = { y:w.y, items:[] }; rows.push(r); } r.items.push(w); });
  rows.sort(function(a,b){ return a.y - b.y; });
  return rows.map(function(r){ return r.items.sort(function(a,b){ return a.x - b.x; }); });
}
// Header cell values: the value token sits to the right of its label on the same row.
function _domtarHeader(pages){
  const p0 = pages[0] || [];
  function valRight(re){
    for (let i=0;i<p0.length;i++){ const w=p0[i]; if (re.test(w.s)){
      const same = p0.filter(function(v){ return Math.abs(v.y-w.y)<=3 && v.x > w.x+3; }).sort(function(a,b){ return a.x-b.x; });
      if (same.length) return same[0].s.trim();
    } }
    return '';
  }
  return { receiver: valRight(/^Load Number/i), truck: valRight(/^Vehicle ID/i),
           invoice: valRight(/^Bill Of Lading/i), dateLoaded: valRight(/^Date Loaded/i) };
}
// Roll rows in reading order, tagged with their Order-Item. The Order-Item / Customer
// PO / Product / Width block prints in the LEFT column, vertically interleaved with the
// first rolls, so group fields are read from the left column only and backfilled per
// order-item in a second pass (early rolls would otherwise miss the later-printed width).
function _domtarRolls(pages){
  const rolls = [], attrs = {};
  let curOI = '';
  (pages||[]).forEach(function(words, pi){
    _domtarRows(words).forEach(function(row){
      const leftLine = row.filter(function(t){ return t.x < 285; }).map(function(t){ return t.s; }).join(' ');
      let m;
      m = leftLine.match(/Order-?Item:\s*([0-9]+\s*-\s*\d+)/i); if (m){ curOI = m[1].replace(/\s+/g,' ').trim(); if (!attrs[curOI]) attrs[curOI] = { po:'', product:'', widthIn:'' }; }
      m = leftLine.match(/Customer PO:\s*(.+)$/i); if (m && curOI) attrs[curOI].po = m[1].trim();
      m = leftLine.match(/Product:\s*(.+)$/i);      if (m && curOI) attrs[curOI].product = m[1].trim();
      m = leftLine.match(/Width:\s*([\d.]+)\s*in/i); if (m && curOI) attrs[curOI].widthIn = parseFloat(m[1]);
      const dta = row.find(function(t){ return /^DTA[0-9A-Z]{6,}$/i.test(t.s); });
      if (dta){
        const nums = row.filter(function(t){ return t.x > 380 && /^[\d,]+$/.test(t.s); }).sort(function(a,b){ return a.x-b.x; }).map(function(t){ return _domtarNum(t.s); });
        const trk  = row.filter(function(t){ return t.x >= 330 && t.x <= 392 && /^\d{4,8}$/.test(t.s); }).sort(function(a,b){ return a.x-b.x; });
        rolls.push({ pg:pi, y:dta.y, lot:dta.s.toUpperCase(), track:(trk[0]?trk[0].s:''),
          lf:(nums[0]||0), adwt:(nums[2]||0), orderItem:curOI });
      }
    });
  });
  rolls.sort(function(a,b){ return (a.pg-b.pg) || (a.y-b.y); });
  rolls.forEach(function(r){ const a = attrs[r.orderItem] || {}; r.po = a.po||''; r.product = a.product||''; r.widthIn = (a.widthIn==null?'':a.widthIn); });
  return rolls;
}
// Build a load: pair rolls into 2-roll packs (parent first) and keep them contiguous.
function _domtarBuildLoad(pages, fileName, source){
  const H = _domtarHeader(pages);
  const raw = _domtarRolls(pages);
  const rows = [];
  for (let i=0;i<raw.length;i++){
    const r = raw[i];
    rows.push({ lot:r.lot, track:r.track, lf:Math.round(r.lf), adwt:Math.round(r.adwt),
      widthIn:(r.widthIn||''), orderItem:r.orderItem, po:r.po, product:r.product,
      pack:(Math.floor(i/2)+1), parent:(i%2===0), sku:'', pcs:1 });
  }
  const orderItems = [];
  rows.forEach(function(r){ if (r.orderItem && orderItems.indexOf(r.orderItem)<0) orderItems.push(r.orderItem); });
  const poHeader = ((orderItems.join(' / ')) + ' ' + (H.truck||'')).trim();
  return { fileName:fileName, source:source,
    header:{ receiver:(H.receiver||''), po:poHeader, invoice:(H.invoice||''), truck:(H.truck||''), dateLoaded:(H.dateLoaded||'') },
    orderItems:orderItems, skuByOrder:{}, rows:rows,
    packCount:Math.floor(rows.length/2), rollCount:rows.length, reconciled:(rows.length%2===0) };
}

// ── PDF word extraction (digital text layer) ───────────────────────────────────
async function _domtarWordsPdf(buf){
  const pdfjsLib = await ensurePdfJs();
  const pdf = await pdfjsLib.getDocument({ data:new Uint8Array(buf) }).promise;
  const pages = [];
  for (let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const vp = page.getViewport({ scale:1 });
    const tc = await page.getTextContent();
    const words = [];
    tc.items.forEach(function(it){ if (!it.str || !it.str.trim()) return;
      words.push({ x:it.transform[4], y:(vp.height - it.transform[5]), s:it.str.trim() }); });
    pages.push(words);
  }
  return pages;
}
// ── OCR path (scanned slip) — same {x,y,s} word shape at PDF-point scale ────────
async function _domtarOcrPdf(buf){
  const pdfjsLib = await ensurePdfJs();
  const worker = await _catTimeout(_catEnsureTesseract(), 120000, 'OCR engine load');
  const pdf = await pdfjsLib.getDocument({ data:new Uint8Array(buf) }).promise;
  const pages = [];
  const SC = 3;
  for (let i=1;i<=pdf.numPages;i++){
    showAlert('Domtar OCR — page ' + i + ' of ' + (pdf.numPages||1) + '…', 'info');
    const page = await pdf.getPage(i);
    const vp = page.getViewport({ scale:SC });
    const cv = document.createElement('canvas'); cv.width = Math.ceil(vp.width); cv.height = Math.ceil(vp.height);
    await page.render({ canvasContext:cv.getContext('2d'), viewport:vp }).promise;
    let words = [];
    try { const d = await worker.recognize(_upmBinarizeCanvas(cv,180), {}, { tsv:true, blocks:true }); words = _upmWordsFromOcr(d.data); } catch(e){}
    pages.push(words.map(function(w){ return { x:w.x/SC, y:w.y/SC, s:w.s }; }));   // back to PDF-point scale
  }
  return pages;
}
async function _domtarImport(f){
  try{
    showAlert('Reading Domtar packing slip…', 'info');
    const buf = await f.arrayBuffer();
    let pages = await _domtarWordsPdf(buf), source = 'pdf';
    const hasRolls = pages.some(function(pg){ return pg.some(function(w){ return /^DTA[0-9A-Z]{6,}$/i.test(w.s); }); });
    if (!hasRolls){ showAlert('Domtar slip has no text layer — running OCR (first run downloads the engine)…', 'info'); pages = await _domtarOcrPdf(buf); source = 'ocr'; }
    const load = _domtarBuildLoad(pages, f.name, source);
    if (!load.rows.length){ showAlert('Domtar: no rolls found in ' + f.name + (source==='ocr'?' (OCR could not read the table — check scan quality).':' (is this a pulp roll packing slip?)'), 'warning'); return; }
    _ediStampLoad(load); load.createdAt = Date.now();
    window._domtarLoads = window._domtarLoads || [];
    window._domtarLoads.push(load);
    _ediSave(); showEDIImportFile();
    if (typeof _ediReopenDetail==='function') _ediReopenDetail('domtar-detail-'+(window._domtarLoads.length-1));
    showAlert('✓ Domtar ' + f.name + (source==='ocr'?' (OCR)':'') + ' — ' + load.rollCount + ' rolls · ' + load.packCount + ' packs — enter the SKU for each order' + (load.reconciled?'':' · ⚠ odd roll count, verify packs'), 'success');
  }catch(err){ console.error(err); showAlert('Domtar read failed — ' + ((err&&err.message)||err), 'danger'); }
}
function handleDomtarUpload(e){ const f = e && e.target && e.target.files && e.target.files[0]; if (e&&e.target) e.target.value=''; if (f) _domtarImport(f); }
function handleDomtarDrop(e){ e.preventDefault(); const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) _domtarImport(f); }

// ── Edits (persist to model so nothing clears on re-render / tile switch) ───────
function _domtarHdrEdit(i, key, val){
  const load = (window._domtarLoads||[])[i]; if (!load) return; load.header = load.header||{};
  load.header[key] = val; try{ _ediSave(); }catch(e){}
}
function _domtarSetSku(i, oi, val){
  const load = (window._domtarLoads||[])[i]; if (!load) return;
  load.skuByOrder = load.skuByOrder || {};
  load.skuByOrder[oi] = val;
  const pid = _domtarProdId(val);
  (load.rows||[]).forEach(function(r){ if (r.orderItem===oi){ r.sku = val; r.productId = pid; } });
  try{ _ediSave(); }catch(e){}
  const el = document.getElementById('domtar-pid-'+i+'-'+_domtarKey(oi)); if (el) el.textContent = pid || '—';
}
function _domtarKey(s){ return String(s==null?'':s).replace(/[^a-zA-Z0-9]/g,'_'); }

// ── SKU master mini-table (import + manual add/remove) ─────────────────────────
function _domtarSaveSku(recs){
  state.domtarSku = recs;
  try{ if (db) db.ref('6021/domtarSku').set(recs).catch(function(){}); }catch(e){}
}
function domtarAddSkuRow(){
  const s = (document.getElementById('domtar-newsku')||{}).value, p = (document.getElementById('domtar-newprod')||{}).value;
  const sku = String(s==null?'':s).trim(), prod = String(p==null?'':p).trim();
  if (!sku){ showAlert('Enter a SKU.', 'warning'); return; }
  const recs = _domtarSkuRecords().filter(function(r){ return String(r.sku).trim().toUpperCase()!==sku.toUpperCase(); });
  recs.push({ sku:sku, prod:prod }); _domtarSaveSku(recs); showEDIImportFile();
}
function domtarDelSkuRow(sku){
  const recs = _domtarSkuRecords().filter(function(r){ return String(r.sku).trim().toUpperCase()!==String(sku).trim().toUpperCase(); });
  _domtarSaveSku(recs); showEDIImportFile();
}
function domtarImportSkuFile(ev){
  const f = ev && ev.target && ev.target.files && ev.target.files[0]; if (ev&&ev.target) ev.target.value=''; if (!f) return;
  const rd = new FileReader();
  rd.onload = function(e){
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array' });
      const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, defval:'' });
      const recs = _domtarSkuRecords(); const seen = {}; recs.forEach(function(r){ seen[String(r.sku).trim().toUpperCase()]=r; });
      let n = 0;
      aoa.forEach(function(row, i){ if (i===0) return; const sku=String(row[0]||'').trim(), prod=String(row[1]||'').trim(); if (!sku) return;
        const k = sku.toUpperCase(); if (seen[k]) seen[k].prod = prod; else { const rec={sku:sku,prod:prod}; recs.push(rec); seen[k]=rec; } n++; });
      if (!n){ showAlert('No SKU rows found. Expected columns: SKU | Prod ID', 'warning'); return; }
      _domtarSaveSku(recs); showEDIImportFile();
      showAlert('✓ Domtar SKU table — ' + n + ' row(s) imported', 'success');
    }catch(err){ showAlert('SKU import failed: ' + ((err&&err.message)||err), 'danger'); }
  };
  rd.readAsArrayBuffer(f);
}
function _domtarSkuTableHtml(){

    +(recs.length ? '<div style="max-height:150px;overflow:auto;margin-top:6px"><table style="width:100%;border-collapse:collapse;font-size:10px"><thead><tr style="background:var(--surface2)"><th style="padding:2px 6px;text-align:left">SKU</th><th style="padding:2px 6px;text-align:left">PRODUCT ID</th><th style="width:24px"></th></tr></thead><tbody>'+rows+'</tbody></table></div>' : '<div style="font-size:9px;color:var(--text2);margin-top:6px">No SKUs yet — import a sheet (SKU | Prod ID) or add rows above.</div>')

// ── Section render ─────────────────────────────────────────────────────────────
function _domtarHdrInput(i, key, label, val){

function renderDomtarSection(){

  const G = '#2e7d32';

  let body;
  if (!loads.length){
    body = '<div style="border:2px dashed var(--border);border-radius:6px;padding:18px;text-align:center;color:var(--text2);font-size:12px">No Domtar loads imported yet</div>';
  } else {
    const totalRolls = loads.reduce(function(s,l){ return s + (l.rows?l.rows.length:0); }, 0);
    const items = loads.map(function(load, idx){
      const H = load.header || {};
      const detailId = 'domtar-detail-' + idx;
      const rows = load.rows || [];
      const skuMissing = (load.orderItems||[]).filter(function(oi){ return !(load.skuByOrder&&load.skuByOrder[oi]); }).length;
      const recColor = skuMissing ? 'var(--warning)' : 'var(--accent2)';
      const recTxt = skuMissing ? ('⚠ enter SKU for '+skuMissing+' order(s)') : '✓ ready';
      // per Order-Item SKU entry
      const skuBlocks = (load.orderItems||[]).map(function(oi){
        const sku = (load.skuByOrder&&load.skuByOrder[oi])||'';
        const pid = _domtarProdId(sku);
        return '<div style="display:flex;flex-direction:column;gap:2px"><label style="font-size:8px;letter-spacing:1px;font-weight:700;color:var(--text2);text-transform:uppercase">SKU · Order '+oi+'</label>'
          +'<div style="display:flex;gap:6px;align-items:center"><input id="domtar-sku-'+idx+'-'+_domtarKey(oi)+'" list="domtar-skulist" value="'+String(sku).replace(/"/g,'&quot;')+'" oninput="_domtarSetSku('+idx+',&quot;'+oi+'&quot;,this.value)" placeholder="SKU" style="padding:4px 7px;border:1.5px solid '+G+';border-radius:6px;font-family:var(--font);font-size:11px;font-weight:700;background:var(--surface);color:var(--text);outline:none;width:110px">'
          +'<span id="domtar-pid-'+idx+'-'+_domtarKey(oi)+'" style="font-size:10px;color:var(--text2);max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+String(pid).replace(/"/g,'&quot;')+'">'+(pid||'—')+'</span></div></div>';
      }).join('');
      const drows = rows.map(function(r, ri){
        const packTop = (ri%2===0);   // parent starts a pack

function exportDomtarLoad(idx){
  const load = (window._domtarLoads||[])[idx];
  if (!load || !load.rows.length) return;
  const gv = function(key, fb){ const el = document.getElementById('domtar-'+key+'-'+idx); return (((el&&el.value)||fb||'')+'').trim(); };
  const receiver = gv('receiver', load.header.receiver), poHeader = gv('po', load.header.po),
        invoice = gv('invoice', load.header.invoice), truck = gv('truck', load.header.truck);
  const missing = (load.orderItems||[]).filter(function(oi){ return !(load.skuByOrder&&load.skuByOrder[oi]); });
  if (missing.length){ showAlert('Domtar: enter a SKU for order '+missing.join(', ')+' before exporting.', 'warning'); return; }
  const aoa = [
    [],
    ['Receiver', receiver, null, 'Total Rolls', load.rows.length, null, null, 'Fraction  Decimal'],
    ['PO #', poHeader, null, null, null, null, null, 0.5, 0.5],
    ['Invoice #', invoice],
    ['Truck #', truck || '', null, null, null, null, null, 'Piper IBD Order #'],
    [], [],
    ['SKU','Product ID','Lot#','Prod ID 2','PO#','Weight','Gross Weight','UOM','LF','Pcs','Width','Exp Date']
  ];
  const _now = new Date();
  const fileDateSerial = Math.round(Date.UTC(_now.getFullYear(), _now.getMonth(), _now.getDate())/86400000) + 25569;
  load.rows.forEach(function(r){
    const sku = (load.skuByOrder && load.skuByOrder[r.orderItem]) || r.sku || '';
    const pid = _domtarProdId(sku) || r.productId || '';
    const wt = (r.adwt===''||r.adwt==null) ? 0 : (parseFloat(r.adwt)||0);
    aoa.push([ sku, pid, r.lot, r.orderItem, r.po, wt, wt, 'ROLL', (parseFloat(r.lf)||0), (r.pcs||1), (parseFloat(r.widthIn)||0), fileDateSerial ]);
  });
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  for (let ri = 8; ri < aoa.length; ri++){ const ref = XLSX.utils.encode_cell({ r:ri, c:11 }); if (ws[ref] && ws[ref].v){ ws[ref].t='n'; ws[ref].z='m/d/yy'; } }
  const safeName = String(receiver||'DOMTAR').replace(/[^\w\-]/g,'').substring(0,31) || 'DOMTAR';
  XLSX.utils.book_append_sheet(wb, ws, safeName);
  XLSX.writeFile(wb, 'EDI_DOMTAR_' + safeName + '.xlsx');
  window._ediDomtarStamps = window._ediDomtarStamps || {};
  _ediStampLoad(load);
  window._ediDomtarStamps[load._id] = { exportedAt: Date.now(), exportedBy: (state.currentUser || '') };
  _ediSave();
  showAlert('✓ Exported EDI_DOMTAR_' + safeName + '.xlsx — ' + load.rows.length + ' rolls · ' + load.packCount + ' packs', 'success');
  showEDIImportFile();
}

      <div style="font-size:22px;margin-bottom:6px">📂</div>

    </div>
    ${pendStr}

function exportEDIFile() {
  const sciGroups = window._ediSciGroups || {};
  const wb = XLSX.utils.book_new();
  let sheetCount = 0;
  const exportedKeys = [];

  // Sci Games selected loads
  document.querySelectorAll('.edi-sci-chk:checked').forEach(chk => {
    const key = chk.value;
    const group = sciGroups[key];
    if (!group || !group.lots.length) return;
    const ws = buildEDISheet_SciGames(group);
    const safeName = group.shipment.toString().substring(0,31);
    XLSX.utils.book_append_sheet(wb, ws, safeName);
    exportedKeys.push(safeName);
    sheetCount++;
  });

  // HBH selected loads
  document.querySelectorAll('.edi-hbh-chk:checked').forEach(chk => {
    const idx = parseInt(chk.value);
    const load = _ediHBHLoads[idx];
    if (!load) return;
    const ws = buildEDISheet_HBH(load);
    const safeName = load.sheetName.toString().substring(0,31);
    XLSX.utils.book_append_sheet(wb, ws, safeName);
    exportedKeys.push(safeName);
    sheetCount++;
  });

  if (!sheetCount) { showAlert('No loads selected for export.', 'warning'); return; }

  const d = new Date();
  const ts = d.getFullYear().toString().slice(2) +
    String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  const fname = 'EDI_Import_' + ts + '.xlsx';
  XLSX.writeFile(wb, fname);
  // Save export timestamps
  saveEDIExportStamp(exportedKeys);
  window._ediStamps = window._ediStamps || {};

function exportPendingPutAway() {
  const PUT_AWAY_LOCS = ['23-TR', '23-RR', '23-GENERAL'];
  const inv = (state.inventory).filter(r => {
    if ((r.pcsPending||0) > 0) return false;
    const loc = (r.location||'').trim().toUpperCase();
    return PUT_AWAY_LOCS.some(p => loc.startsWith(p) || loc.includes(p));
  });
  if (!inv.length) { showAlert('No pending put away inventory to export.','warning'); return; }
  const dc = (a,b) => { const ta=new Date(a).getTime(), tb=new Date(b).getTime(); if(isNaN(ta)&&isNaN(tb))return 0; if(isNaN(ta))return 1; if(isNaN(tb))return -1; return ta-tb; };
  const fmtD = v => v ? new Date(v).toLocaleDateString() : '';
  // One row per physical roll - sorted to make cleaning the pending easy.
  const rows = inv.slice().sort((a,b)=>
    (a.customer||'').localeCompare(b.customer||'') ||
    dc(a.dateRecd,b.dateRecd) ||
    (a.bol||'').localeCompare(b.bol||'') ||
    (a.sku||'').localeCompare(b.sku||'') ||
    (a.location||'').localeCompare(b.location||'') ||
    (a.lot||'').localeCompare(b.lot||'') ||
    (a.skidId||'').localeCompare(b.skidId||''));
  const data = [['CUSTOMER','DATE RECD','BU','INBOUND BOL','SKU','LOCATION','LOT #','SKID ID']];
  rows.forEach(r => data.push([ r.customer||'', fmtD(r.dateRecd), r.bu||'', r.bol||'', r.sku||'', r.location||'', r.lot||'', r.skidId||'' ]));
  const ws = XLSX.utils.aoa_to_sheet(data);
  ws['!cols'] = [{wch:20},{wch:12},{wch:14},{wch:16},{wch:16},{wch:16},{wch:16},{wch:16}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Pending Put Away');
  XLSX.writeFile(wb, 'PickFlow_6021_PendingPutAway_'+new Date().toISOString().slice(0,10)+'.xlsx');
  showAlert('Pending Put Away exported to Excel ('+rows.length+' rolls).','success');
}

      </div>
      <div style="color:var(--text2);font-size:11px;cursor:pointer" onclick="viewCCSession('${s.id}')">${new Date(s.createdAt).toLocaleString()} · ${s.countedBy}</div>
      <div style="color:var(--text2);font-size:11px">${(s.locations||[]).length} locations${s.adjustments&&s.adjustments.length?` · <span style="color:var(--accent2)">Adjusted</span>`:''}</div>
    </div>`).join('');
}

function showCycleCountStart() {
  state.currentView = 'cyclecount';
  const SKIP_LOCS = ['23-TR','23-RR','23-GENERAL','01-GENERAL','23-GHOST','CYC_CNT'];
  const panel = document.getElementById('main-panel');
  panel.innerHTML = '<div class="panel-inner" style="padding:20px"><div style="color:var(--text2);font-size:13px">Loading cycle count data...</div></div>';

  if (!db) {
    panel.innerHTML = '<div class="panel-inner" style="padding:20px"><div class="alert alert-warning">Not connected to database.</div></div>';
    return;
  }

  // Load ALL location sources in parallel: live sessions + custom location list + monthly archive
  Promise.all([
    db.ref('cycleCount6021').orderByChild('createdAt').once('value'),
    db.ref('locationList6021').once('value'),
    db.ref('cycleCountArchive6021').once('value')
  ]).then(([sessionSnap, locSnap, archiveSnap]) => {
    const data        = sessionSnap.val() || {};            // live (current-month) sessions
    const archiveData = archiveSnap.val() || {};            // { 'YYYY-MM': { id: session } }
    window._ccArchiveData = archiveData;
    // Flatten archived sessions and RECOMBINE with live so all coverage / last-counted / suggested
    // logic below sees the full history exactly as before (archiving only changes where rows live).
    const archivedSessions = [];
    Object.keys(archiveData).forEach(mk => Object.values(archiveData[mk]||{}).forEach(s => archivedSessions.push(s)));
    const sessions = [...Object.values(data), ...archivedSessions].sort((a,b)=>b.createdAt-a.createdAt);
    // Group every session by month for the audit panel + dropdown (in-memory; no per-month reads).
    const ccCurKey = ccMonthKey(Date.now());
    window._ccCurMonthKey = ccCurKey;
    window._ccSessionsByMonth = {};
    sessions.forEach(s => { const k=ccMonthKey(s.createdAt); (window._ccSessionsByMonth[k]=window._ccSessionsByMonth[k]||[]).push(s); });
    const ccMonthKeys = [...new Set(sessions.map(s=>ccMonthKey(s.createdAt)))];
    if (!ccMonthKeys.includes(ccCurKey)) ccMonthKeys.push(ccCurKey);
    ccMonthKeys.sort().reverse();
    const ccMonthOpts = ccMonthKeys.map(k=>`<option value="${k}"${k===ccCurKey?' selected':''}>${ccMonthLabel(k)}</option>`).join('');

    // Build full location list from all known sources
    const locSet = new Set();

    // 1. All locations ever in inventory (any status)
    state.inventory.forEach(r => { if (r.location) locSet.add(r.location); });

    // 2. All locations ever counted in any session
    sessions.forEach(s => (s.locations||[]).forEach(l => locSet.add(l)));

    // 3. Manually added persistent locations
    const customLocsObj = locSnap.val() || {};
    Object.keys(customLocsObj).forEach(l => locSet.add(l));
    window._ccCustomLocs = new Set(Object.keys(customLocsObj));

    // 4. Auto-fill gaps using the warehouse location naming pattern (e.g. 23-XX-YY)
    //    Detect prefix + max aisle + max bay from known locations, then generate full grid
    const patternRe = /^(\d+)-(\d+)-(\d+)$/;
    const prefixGroups = {};
    [...locSet].forEach(l => {
      const m = l.match(patternRe);
      if (!m) return;
      const prefix = m[1];
      const aisle  = parseInt(m[2], 10);
      const bay    = parseInt(m[3], 10);
      if (!prefixGroups[prefix]) prefixGroups[prefix] = { maxAisle:0, maxBay:{}, globalMaxBay:0 };
      const g = prefixGroups[prefix];
      if (aisle > g.maxAisle) g.maxAisle = aisle;
      if (!g.maxBay[aisle] || bay > g.maxBay[aisle]) g.maxBay[aisle] = bay;
      if (bay > g.globalMaxBay) g.globalMaxBay = bay; // track max bay across ALL aisles
    });
    // Generate every aisle/bay combo using the global max bay so no aisle is short-changed
    Object.entries(prefixGroups).forEach(([prefix, g]) => {
      for (let a = 0; a <= g.maxAisle; a++) {
        const aisleStr = String(a).padStart(2,'0');
        const maxB = g.globalMaxBay || 0;  // use global max so sparse aisles get full range
        if (maxB === 0) continue; // no bays seen for this aisle yet — skip
        for (let b = 1; b <= maxB; b++) {
          locSet.add(prefix + '-' + aisleStr + '-' + String(b).padStart(2,'0'));
        }
      }
    });

    // Cache for tracker and other views
    window._ccHistoricLocs = [...locSet];

    // Filter skip locs
    const allLocs     = [...locSet].sort();
    const storageLocs = allLocs.filter(l => !SKIP_LOCS.some(p => l.toUpperCase().includes(p.toUpperCase())));

    // Month window
    const now        = new Date();
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
    const monthEnd   = new Date(now.getFullYear(), now.getMonth()+1, 0, 23,59,59).getTime();
    const monthName  = now.toLocaleDateString('en-US',{month:'long',year:'numeric'});
    const todayStr   = now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});

    // Working days remaining
    function workingDaysRemaining() {
      const lastDay = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
      let count = 0;
      for (let d = now.getDate(); d <= lastDay; d++) {
        const dow = new Date(now.getFullYear(), now.getMonth(), d).getDay();
        if (dow !== 0 && dow !== 6) count++;
      }
      return count;
    }
    const wdRemaining = workingDaysRemaining();

    // Suggested: all locs with put-away activity in the last 5 working days
    const _getWorkingDaysAgo = (n) => {
      const d = new Date(); d.setHours(0,0,0,0);
      let count = 0;
      while (count < n) {
        d.setDate(d.getDate() - 1);
        const day = d.getDay();
        if (day !== 0 && day !== 6) count++;
      }
      return d.getTime();
    };
    const fiveWorkingDaysAgo = _getWorkingDaysAgo(3);

        // Last counted date per location (across all sessions)
    const locLastCounted = {};
    sessions.forEach(s => {
      if (!s.createdAt) return;
      (s.locations||[]).forEach(loc => {
        if (!locLastCounted[loc] || s.createdAt > locLastCounted[loc])
          locLastCounted[loc] = s.createdAt;
      });
    });

    const locLastPutaway = {};
    state.inventory.forEach(r => {
      const loc = (r.location||'').toUpperCase();
      if (!r.location || SKIP_LOCS.some(p => loc.includes(p.toUpperCase()))) return;
      if ((r.pcsPending||0) > 0) return;
      if (r.dateRecd) {
        const t = r.dateRecd instanceof Date ? r.dateRecd.getTime() : new Date(r.dateRecd).getTime();
        if (isNaN(t) || t < fiveWorkingDaysAgo) return;
        if (!locLastPutaway[r.location] || t > locLastPutaway[r.location])
          locLastPutaway[r.location] = t;
      }
    });
    const _toMidnight = ts => { const d=new Date(ts); d.setHours(0,0,0,0); return d.getTime(); };
    const suggestedLocs = Object.entries(locLastPutaway)
      .sort((a,b) => {
        const dayDiff = _toMidnight(b[1]) - _toMidnight(a[1]); // most recent date first
        if (dayDiff !== 0) return dayDiff;
        return a[0].localeCompare(b[0]);                         // same day → location A→Z
      }).slice(0,15)
      .map(([loc,ts])=>({
        loc,
        date: new Date(ts).toLocaleDateString('en-US'),
        lastCounted: locLastCounted[loc]
          ? new Date(locLastCounted[loc]).toLocaleDateString('en-US')
          : null
      }));

    const fi = 'background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px 12px;color:var(--text);font-family:var(--font);font-size:13px;outline:none;width:100%';

    // Month count map
    const monthCountMap = {};
    sessions.forEach(s => {
      if (!s.createdAt||s.createdAt<monthStart||s.createdAt>monthEnd) return;
      (s.locations||[]).forEach(loc=>{ monthCountMap[loc]=(monthCountMap[loc]||0)+1; });
    });
    window._ccMonthCountMap = monthCountMap;

    // Last counted date per location (across all sessions, not just this month)
        const uncountedLocs   = storageLocs.filter(l => !monthCountMap[l]);
    const countedLocsArr  = storageLocs.filter(l =>  monthCountMap[l]);
    const pct             = storageLocs.length > 0 ? Math.round(countedLocsArr.length/storageLocs.length*100) : 0;
    const pctColor        = pct>=100?'var(--accent2)':pct>=50?'var(--warning)':'var(--danger)';
    const monthSessions   = sessions.filter(s=>s.createdAt>=monthStart&&s.createdAt<=monthEnd);
    let totalLines=0, accurateLines=0, totalAdjAdd=0, totalAdjMiss=0, totalAdjExp=0;
    monthSessions.forEach(s=>{
      const adjMap = {};
      (s.adjustments||[]).forEach(a=>{ adjMap[a.loc] = a; }); // keyed by location only

      // Accuracy is per LOCATION — a location is accurate if net adj = 0
      const sessionLocs = [...new Set((s.entries||[]).filter(e=>!e.empty&&e.sku).map(e=>e.loc))];
      sessionLocs.forEach(loc=>{
        totalLines++;
        const saved = adjMap[loc];
        const add  = saved ? (saved.adjAdd||0)  : 0;
        const miss = saved ? (saved.adjMiss||0) : 0;
        if (add === 0 && miss === 0) accurateLines++; // accurate only if no adjustments at all
        totalAdjAdd  += add;
        totalAdjMiss += miss;
      });
      // Expected rolls for count accuracy
      (s.entries||[]).forEach(e=>{
        if (e.empty) return;
        totalAdjExp += (e.expectedPlt||0);
      });
    });
    const binAcc = totalLines>0 ? Math.round(accurateLines/totalLines*100) : null;
    const cntAcc = totalAdjExp>0 ? Math.max(0,Math.round((1-(totalAdjAdd+totalAdjMiss)/totalAdjExp)*100)) : null;
    const invAcc = inventoryAccuracyStats().pct;

    let html = `
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">
      <div>
        <div style="font-size:18px;font-weight:bold;letter-spacing:2px">🔢 CYCLE COUNT</div>
        <div style="font-size:13px;color:var(--accent2);font-weight:bold;margin-top:4px">${todayStr}</div>
        <div style="font-size:11px;color:var(--text2);margin-top:2px">Goal: count all locations within <strong style="color:var(--accent)">${monthName}</strong></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-sm" onclick="showAddLocationModal()" style="font-size:11px">+ Add Location</button>
        <button class="btn" onclick="showCCTracker()" style="font-size:11px;background:var(--surface2)">📊 Month Tracker</button>
      </div>
    </div>

    <!-- Summary cards -->
    <div style="display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-bottom:16px">
      ${[
        {label:'TOTAL LOCATIONS', val:storageLocs.length, color:'var(--text)'},
        {label:'COUNTED', val:countedLocsArr.length, color:'var(--accent2)'},
        {label:'NOT COUNTED', val:uncountedLocs.length, color:uncountedLocs.length>0?'var(--danger)':'var(--accent2)'},
        {label:'SESSIONS', val:monthSessions.length, color:'var(--accent)'},
        {label:'INV ACCURACY', val:invAcc!==null?invAcc.toFixed(1)+'%':'—', color:invAcc===null?'var(--text2)':invAcc>=98?'var(--accent2)':invAcc>=95?'var(--warning)':'var(--danger)'},
        {label:'BIN ACCURACY', val:binAcc!==null?binAcc+'%':'—', color:binAcc===null?'var(--text2)':binAcc>=100?'var(--accent2)':binAcc>=95?'var(--warning)':'var(--danger)'},
        {label:'COUNT ACCURACY', val:cntAcc!==null?cntAcc+'%':'—', color:cntAcc===null?'var(--text2)':cntAcc>=100?'var(--accent2)':cntAcc>=90?'var(--warning)':'var(--danger)'},
        {label:'WORK DAYS LEFT', val:wdRemaining, color:wdRemaining<=3?'var(--danger)':wdRemaining<=7?'var(--warning)':'var(--accent2)'}
      ].map(c=>`
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center">
          <div style="font-size:9px;color:${c.color};letter-spacing:1px;margin-bottom:4px;font-weight:bold">${c.label}</div>
          <div style="font-size:20px;font-weight:bold;color:${c.color}">${c.val}</div>
        </div>`).join('')}
    </div>

    <!-- Main 3-col grid -->
    <div style="display:grid;grid-template-columns:200px 1fr 300px;gap:14px;align-items:start">

      <!-- Suggested -->
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px">
        <div style="font-size:10px;font-weight:bold;color:var(--warning);letter-spacing:1px;margin-bottom:8px">⚡ SUGGESTED</div>
        <div style="font-size:9px;color:var(--text2);margin-bottom:10px;line-height:1.4">Most recently put-away locations</div>`;

    if (!suggestedLocs.length) {
      html += `<div style="font-size:11px;color:var(--text2);text-align:center;padding:12px">No recent put-away data</div>`;
    } else {
      suggestedLocs.forEach(({loc, date, lastCounted}) => {
        const isCounted = monthCountMap[loc] > 0;
        html += `<div onclick="ediSuggestSelect('${loc}')" title="Click to pre-select" style="display:flex;align-items:center;gap:6px;padding:5px 6px;margin-bottom:2px;border-radius:5px;cursor:pointer;border:1px solid var(--border);background:${isCounted?'rgba(26,158,122,0.07)':'rgba(224,62,62,0.07)'}"
          onmouseover="this.style.background='rgba(79,110,247,0.1)'" onmouseout="this.style.background='${isCounted?'rgba(26,158,122,0.07)':'rgba(224,62,62,0.07)'}'">
          <span style="width:8px;height:8px;border-radius:50%;background:${isCounted?'var(--accent2)':'var(--danger)'};display:inline-block;flex-shrink:0"></span>
          <div style="flex:1;min-width:0">
            <div style="font-size:11px;font-weight:bold;color:var(--accent)">${loc}</div>
            <div style="font-size:9px;color:var(--text2)">Put away: ${date}</div>
            <div style="font-size:9px;color:${lastCounted?'var(--accent2)':'var(--danger)'}">Counted: ${lastCounted||'Never'}</div>
          </div>
        </div>`;
      });
    }

    html += `</div>

      <!-- Location selector -->
      <div>
        <div style="font-size:11px;color:var(--text2);letter-spacing:1px;margin-bottom:10px;font-weight:bold">
          SELECT LOCATIONS TO COUNT
          <span style="font-size:10px;font-weight:normal;margin-left:8px">${storageLocs.length} total locations (${uncountedLocs.length} not yet counted)</span>
        </div>
        <div class="form-group" style="margin-bottom:10px">
          <input type="text" id="cc-loc-search" placeholder="Filter locations..." oninput="filterCCLocs()" style="${fi}">
        </div>
        <div class="form-group" style="margin-bottom:10px">
          <select id="cc-cust-filter" onchange="applyCCFilters()" style="${fi}" title="Show only locations holding this customer and count only their inventory">
            <option value="__all__">All customers</option>
            ${(()=>{ const cs=[...new Set(state.inventory.map(r=>(r.customer||'').trim()).filter(Boolean))].sort(); return cs.map(c=>'<option value="'+String(c).replace(/"/g,'&quot;')+'">'+String(c).replace(/</g,'&lt;')+'</option>').join(''); })()}
          </select>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
          <button class="btn btn-sm" onclick="document.querySelectorAll('.cc-loc-chk').forEach(c=>c.checked=true);updateCCSelCount()">Select All</button>
          <button class="btn btn-sm" onclick="document.querySelectorAll('.cc-loc-chk').forEach(c=>c.checked=false);updateCCSelCount()">Clear All</button>
          <button class="btn btn-sm" onclick="selectUncountedOnly()" style="background:rgba(224,62,62,0.1);color:var(--danger);border-color:var(--danger)">Select Uncounted Only</button>
          <span id="cc-sel-count" style="font-size:12px;color:var(--text2);padding:5px 8px">0 selected</span>
        </div>
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;margin-bottom:6px">
            <span style="font-weight:bold;color:var(--text);font-size:12px">${monthName} Progress</span>
            <span style="font-weight:bold;color:${pctColor};font-size:12px">${countedLocsArr.length} / ${storageLocs.length} &nbsp; ${pct}%
              <span style="font-size:10px;color:${wdRemaining<=3?'var(--danger)':'var(--text2)'}"> &nbsp;(${wdRemaining} work days left)</span>
            </span>
          </div>
          <div style="background:var(--border);border-radius:4px;height:8px;overflow:hidden">
            <div style="width:${pct}%;background:${pctColor};height:100%;border-radius:4px;transition:width 0.4s"></div>
          </div>
          ${(()=>{
            const remaining = storageLocs.length - countedLocsArr.length;
            if (remaining <= 0) return '<div style="font-size:11px;color:var(--accent2);margin-top:6px;font-weight:bold">✓ All locations counted this month!</div>';
            const perDay = wdRemaining > 0 ? Math.ceil(remaining / wdRemaining) : remaining;
            const urgColor = perDay >= 20 ? 'var(--danger)' : perDay >= 10 ? 'var(--warning)' : 'var(--accent2)';
            return '<div style="font-size:11px;color:var(--text2);margin-top:6px">'
              + '<span style="color:var(--text2)">To finish on time: </span>'
              + '<span style="font-weight:bold;color:'+urgColor+'">'+perDay+' location'+(perDay===1?'':'s')+' / day</span>'
              + '<span style="color:var(--text2)"> &nbsp;('+remaining+' remaining ÷ '+wdRemaining+' work day'+(wdRemaining===1?'':'s')+')</span>'
              + '</div>';
          })()}
        </div>
        <div class="cc-loc-list" id="cc-loc-list" style="max-height:340px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:6px">`;

    if (!storageLocs.length) {
      html += '<div style="text-align:center;color:var(--text2);padding:20px;font-size:13px">No locations found. Import inventory first.</div>';
    } else {
      storageLocs.forEach(l => {
        const avail   = state.inventory.filter(r=>r.location===l&&(r.pcsPending||0)===0).length;
        const picked  = state.inventory.filter(r=>r.location===l&&(r.pcsPending||0)>0).length;
        const mc      = monthCountMap[l]||0;
        const isSugg  = suggestedLocs.some(s=>s.loc===l);
        const isCustom= window._ccCustomLocs && window._ccCustomLocs.has(l);
        const isEmpty = avail===0 && picked===0;
        const badge   = mc>0
          ? `<span style="background:rgba(26,158,122,0.15);color:var(--accent2);border-radius:10px;padding:1px 8px;font-size:11px;font-weight:bold">✓ ${mc}x</span>`
          : `<span style="background:rgba(224,62,62,0.1);color:var(--danger);border-radius:10px;padding:1px 8px;font-size:11px">Not counted</span>`;
        const suggBorder = isSugg ? 'border-left:3px solid var(--warning);' : '';
        html += `<label class="cc-loc-item" data-counted="${mc>0}" style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border);${suggBorder}" onmouseover="this.style.background='rgba(79,110,247,0.07)'" onmouseout="this.style.background=''">
          <input type="checkbox" class="cc-loc-chk" value="${l}" onchange="updateCCSelCount()" style="cursor:pointer;width:16px;height:16px">
          <span style="font-weight:bold;color:var(--accent);min-width:90px">${l}</span>
          ${isSugg?`<span style="font-size:9px;color:var(--warning);font-weight:bold">⚡</span>`:''}
          ${isCustom?`<span style="font-size:9px;color:var(--accent);background:rgba(79,110,247,0.12);border-radius:4px;padding:1px 5px">custom</span>`:''}
          ${isEmpty
            ? `<span style="color:var(--text2);font-size:12px;font-style:italic">Empty</span>`
            : `<span style="color:var(--accent2);font-size:12px">${avail} avail</span>`}
          ${picked?`<span style="color:var(--warning);font-size:12px">${picked} picked</span>`:''}
          <span style="margin-left:auto">${badge}</span>
          ${isCustom&&isAdmin()?`<button onclick="event.preventDefault();removeCustomLocation('${l}')" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:12px;padding:0 4px;margin-left:4px" title="Remove location">✕</button>`:''}
        </label>`;
      });
    }

    html += `</div>
        <button class="btn btn-primary" style="width:100%;margin-top:12px;font-size:14px;padding:12px" onclick="startCycleCount()">Start Count →</button>
      </div>

      <!-- Monthly counts (audit) -->
      <div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px">
          <div style="font-size:11px;color:var(--text2);letter-spacing:1px;font-weight:bold">COUNTS — <span id="cc-month-label"></span></div>
          <select id="cc-month-select" onchange="loadCCMonth(this.value)" style="background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:4px 8px;color:var(--text);font-family:var(--font);font-size:11px;outline:none">${ccMonthOpts}</select>
        </div>
        <div id="cc-month-list">`;

    html += `</div></div></div>`;

    panel.innerHTML = '<div class="panel-inner" style="padding:20px">' + html + '</div>';
    window._ccAllLocs = storageLocs;
    // ── CUSTOMER FILTER (additive) — map each location to the customers it holds so the
    // customer dropdown can stack with the existing text filter without touching filterCCLocs().
    try { window._ccLocCustomers = (function(){ var m={}; state.inventory.forEach(function(r){ if(!r.location) return; var c=(r.customer||'').trim(); if(!c) return; if(!m[r.location]) m[r.location]={}; m[r.location][c]=1; }); return m; })(); } catch(e){ window._ccLocCustomers={}; }
    window._ccCustFilter = '__all__';
    try { var _ccSearchEl=document.getElementById('cc-loc-search'); if(_ccSearchEl) _ccSearchEl.addEventListener('input', applyCCFilters); } catch(e){}
    window._ccSuggestedLocs = suggestedLocs.map(s=>s.loc);
    renderCCMonthList(ccCurKey);
    // Physically move any prior-month live sessions into the monthly archive node.
    // Safe ordering: write archive copies first, confirm, THEN remove from live (worst case = a
    // harmless duplicate, never data loss). cycleCount6021 then holds the current month only.
    const ccPrior = Object.values(data).filter(s => ccMonthKey(s.createdAt) !== ccCurKey);
    if (ccPrior.length) {
      const upd = {}; ccPrior.forEach(s => upd['cycleCountArchive6021/'+ccMonthKey(s.createdAt)+'/'+s.id] = s);
      db.ref().update(upd)
        .then(() => { const rem = {}; ccPrior.forEach(s => rem['cycleCount6021/'+s.id] = null); return db.ref().update(rem); })
        .catch(()=>{});
    }
  });
}

// Show modal to pick which uncounted locations to select
function selectUncountedOnly() {
  const mm       = window._ccMonthCountMap || {};
  const allLocs  = window._ccAllLocs || [];
  const uncounted = allLocs.filter(l => !mm[l]);

  if (!uncounted.length) { showAlert('All locations have been counted this month!', 'success'); return; }

  // Build inventory summary per location
  const invByLoc = {};
  (state.inventory||[]).forEach(r => {
    if (!r.location) return;
    if (!invByLoc[r.location]) invByLoc[r.location] = {avail:0, picked:0};
    if ((r.pcsPending||0)>0) invByLoc[r.location].picked++;
    else invByLoc[r.location].avail++;
  });

  const fi = 'background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--text);font-family:var(--font);font-size:12px;outline:none;width:100%;box-sizing:border-box';

  let rows = uncounted.map((loc, i) => {
    const inv  = invByLoc[loc] || {avail:0, picked:0};
    const desc = inv.avail ? `${inv.avail} avail` : inv.picked ? `${inv.picked} picked` : 'Empty';
    const descColor = inv.avail ? 'var(--accent2)' : inv.picked ? 'var(--warning)' : 'var(--text2)';
    return `<label style="display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--border);cursor:pointer;font-size:12px;"
      onmouseover="this.style.background='rgba(79,110,247,0.06)'" onmouseout="this.style.background=''">
      <input type="checkbox" class="unc-loc-chk" value="${loc}" checked style="width:15px;height:15px;cursor:pointer;accent-color:var(--accent)">
      <span style="font-weight:bold;color:var(--accent);min-width:90px">${loc}</span>
      <span style="font-size:11px;color:${descColor}">${desc}</span>
    </label>`;
  }).join('');

  let h = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal" style="width:480px;max-height:80vh;display:flex;flex-direction:column">
      <h2 style="margin-bottom:4px">Select Uncounted Locations</h2>
      <p style="font-size:11px;color:var(--text2);margin-bottom:12px">${uncounted.length} locations not yet counted this month</p>
      <div style="margin-bottom:10px">
        <input type="text" placeholder="Filter..." oninput="filterUncountedModal(this.value)" style="${fi}">
      </div>
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <button class="btn btn-sm" onclick="document.querySelectorAll('.unc-loc-chk').forEach(c=>c.checked=true)">☑ All</button>
        <button class="btn btn-sm" onclick="document.querySelectorAll('.unc-loc-chk').forEach(c=>c.checked=false)">☐ None</button>
        <span id="unc-sel-count" style="font-size:11px;color:var(--text2);padding:5px">${uncounted.length} selected</span>
      </div>
      <div id="unc-loc-list" style="flex:1;overflow-y:auto;border:1px solid var(--border);border-radius:6px;max-height:380px">
        ${rows}
      </div>
      <div class="modal-actions" style="margin-top:14px">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="applyUncountedSelection()">Apply Selection</button>
      </div>
    </div>
  </div>`;

  document.body.insertAdjacentHTML('beforeend', h);
  // Update count as user checks/unchecks
  document.querySelectorAll('.unc-loc-chk').forEach(c => {
    c.addEventListener('change', () => {
      const sel = document.querySelectorAll('.unc-loc-chk:checked').length;
      const el = document.getElementById('unc-sel-count');
      if (el) el.textContent = sel + ' selected';
    });
  });
}

function filterUncountedModal(query) {
  const q = query.toLowerCase();
  document.querySelectorAll('#unc-loc-list label').forEach(label => {
    const loc = label.querySelector('.unc-loc-chk')?.value || '';
    label.style.display = loc.toLowerCase().includes(q) ? '' : 'none';
  });
}

function applyUncountedSelection() {
  const selected = new Set(
    [...document.querySelectorAll('.unc-loc-chk:checked')].map(c => c.value)
  );
  // Uncheck everything in the main list first, then check selected uncounted ones
  document.querySelectorAll('.cc-loc-chk').forEach(c => {
    if (selected.has(c.value)) c.checked = true;
    // leave already-checked ones alone if not in uncounted set
  });
  updateCCSelCount();
  closeModal();
}


// Add a custom persistent location
function showAddLocationModal() {
  const fi = 'width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px 12px;color:var(--text);font-family:var(--font);font-size:14px;outline:none;box-sizing:border-box;margin-top:6px';
  let h  = '<div class="modal-overlay" onclick="if(event.target===this)closeModal()">';
  h += '<div class="modal" style="width:380px">';
  h += '<h2 style="margin-bottom:12px">➕ Add Location</h2>';
  h += '<p style="font-size:12px;color:var(--text2);margin-bottom:14px">Add a location that should always appear in the cycle count list, even when empty.</p>';
  h += `<label style="font-size:12px;font-weight:bold">Location Name</label>
        <input id="new-loc-input" type="text" placeholder="e.g. 23-04-15" style="${fi}" onkeydown="if(event.key==='Enter')saveCustomLocation()">`;
  h += '<div class="modal-actions" style="margin-top:16px">';
