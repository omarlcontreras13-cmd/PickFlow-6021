function exportIPGLoad(idx) {
  const load    = _ipgLoads[idx];
  if (!load) return;
  const field  = document.getElementById('ipg-load-id');
  // Prefer the Shipment # captured on this load at drop time; fall back to the field,
  // then prompt. No file is created without a reference number.
  let loadId   = (load.loadId || (field && field.value) || '').trim();
  if (!loadId) {
    loadId = (window.prompt('Enter the Shipment # (Load ID / BOL) for this load before creating the import file:', '') || '').trim();
    if (!loadId) { showAlert('Shipment # is required — no file was created.', 'warning'); return; }
  }
  load.loadId = loadId;        // remember it on this load
  if (field && !field.value) field.value = loadId;
  renderIPGLoads();            // refresh the header so it shows the now-set reference

  const totalRolls = load.rolls.length;
  const truck   = (load.carrier||'') + '_' + (load.carrierN||'');
  const poNum   = load.shipTo + ' ' + load.custOrder + ' ' + loadId;

  const aoa = [
    [''],
    ['Receiver', loadId,  '', 'Total Rolls', totalRolls, '', '', 'Fraction  Decimal'],
    ['PO #',     poNum,   '', '', '', '', '', 0.5, 0.5],
    ['Invoice #',load.custOrder],
    ['Truck #',  truck,   '', '', '', '', '', 'Piper IBD Order #'],
    [''],
    [''],
    ['SKU','Product ID','Lot#','Prod ID 2','PO#','Weight','Gross Weight','UOM','LF','Pcs','Width','Exp Date']
  ];

  load.rolls.forEach(r => {
    aoa.push([
      r.sku, r.prodId, r.rollId, r.custOrder, r.custOrder,
      r.wt, r.wt, 'ROLLS', r.lf, 1, r.widthNum, r.todaySerial
    ]);
  });

  const wb  = XLSX.utils.book_new();
  const ws  = XLSX.utils.aoa_to_sheet(aoa);
  // Format Exp Date column (col L = index 11) as date
  const range = XLSX.utils.decode_range(ws['!ref']);
  for (let row = 8; row <= range.e.r; row++) {
    const cell = ws[XLSX.utils.encode_cell({r:row, c:11})];
    if (cell) cell.z = 'm/d/yyyy';
  }
  XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
  const fname = 'IPG_Import_' + load.custOrder + '_' + loadId + '.xlsx';
  XLSX.writeFile(wb, fname);
  showAlert('✓ Exported ' + fname, 'success');
}

// ─── CATALYST INBOUND FILE PROCESSING ───────────────────────────────────────
// One Excel = one load. Manual header fields (Shipment / Outbound Order / Customer
// Order / Rail Car / Receiver / Invoice) are captured at drop time and drive the
// derived fields:  Prod ID 1 = Shipment + " " + Invoice ;  Prod ID 2 = Customer
// Order + " " + Outbound Order ;  PO = Rail Car + " " + Prod ID 1.  KG weights
// convert to LBS (x2.20462) when the KG box is checked; width & lineal convert
// cm->in (x0.393701).  A roll id carrying an asterisk is the PARENT of a 2-pack
// bundle and the next row is its child — they collapse to ONE line (Pcs 2, weights
// summed); the asterisk stays on the Lot#. No asterisk = standalone roll (Pcs 1).
let _catLoads = [];
const CAT_CM2IN = 0.393701, CAT_KG2LB = 2.20462;

function _catFindCol(hdr, cands, opts) {
  opts = opts || {};
  const norm = x => String(x==null?'':x).trim().toLowerCase();
  for (let c=0; c<hdr.length; c++) {
    const h = norm(hdr[c]);
    if (!h) continue;
    if (opts.not && opts.not.some(n => h.includes(n))) continue;
    for (const cand of cands) { const cn = cand.toLowerCase(); if (opts.exact ? h===cn : h.includes(cn)) return c; }
  }
  return -1;
}

function handleCatalystDrop(e){ _catRouteFiles(Array.from((e.dataTransfer&&e.dataTransfer.files)||[])); }

// Route a mixed drop/selection: PDF(s) first (auto-fill Receiver = BOL # and
// Invoice = Delivery Note #), then Excel(s) — which snapshot the now-filled fields.
async function _catRouteFiles(files){
  const list = Array.from(files||[]);
  const pdfs = list.filter(f=>/\.pdf$/i.test(f.name));
  const xls  = list.filter(f=>/\.(xls[xmb]?|csv)$/i.test(f.name));
  for (const f of pdfs) { try { await processCatalystPDF(f); } catch(err){ console.error(err); } }
  for (const f of xls)  processCatalystFile(f);
  if (!pdfs.length && !xls.length && list.length) showAlert('Catalyst: drop a .xlsx / .xls / .xlsb or a .pdf.', 'warning');
}

// Pull a labelled value out of the extracted PDF lines. The value may sit after
// the label on the same line, or be the first matching token on the next line.
function _catGrab(lines, labels, valRe){
  for (let i=0; i<lines.length; i++){
    const ln = lines[i];
    for (const lab of labels){
      const m = ln.match(lab);
      if (!m) continue;
      let vm = ln.slice(m.index + m[0].length).match(valRe);
      if (vm) return (vm[1]||vm[0]).trim();
      if (i+1 < lines.length){ vm = lines[i+1].match(valRe); if (vm) return (vm[1]||vm[0]).trim(); }
    }
  }
  return '';
}

// Catalyst "Order No." (XDK docs) / "Inbound Order No." (REG docs) for the XDK
// email Order Details. Never matches "Cust. Order No" or "Outbound Order No".
function _catGrabOrderNo(lines){
  const N=/(\d{4,})/;
  for (const l of (lines||[])){ if (/inbound\s*order\s*no/i.test(l)){ const m=String(l).replace(/.*inbound\s*order\s*no\.?\s*:?/i,'').match(N); if(m) return m[1]; } }
  for (const l of (lines||[])){ if (/cust|customer|outbound/i.test(l)) continue; if (/\border\s*no\.?\s*:?/i.test(l)){ const m=String(l).replace(/.*?order\s*no\.?\s*:?/i,'').match(N); if(m) return m[1]; } }
  return '';
}
// Read a Catalyst BOL / Delivery PDF and auto-fill Receiver (BOL #) + Invoice (Delivery Note #).
async function processCatalystPDF(file){
  try{
    showAlert('Reading Catalyst PDF...', 'info');
    // pdf.js detaches the ArrayBuffer it is handed, so read a FRESH buffer for each pass.
    let lines = await trExtractPdfLines(await file.arrayBuffer());
    if (lines && lines.length){ _catApplyPdfFields(lines, 'PDF'); return; }
    // No text layer (scanned/image PDF) -> OCR the page (fresh buffer)
    showAlert('PDF has no text layer \u2014 running OCR (first run downloads the engine, give it a moment)...', 'info');
    lines = await _catOcrPdf(await file.arrayBuffer());
    if (!lines || !lines.length){ showAlert('Catalyst PDF: OCR could not read it \u2014 enter Outbound Order # and Rail Car # manually.', 'warning'); return; }
    _catApplyPdfFields(lines, 'PDF (OCR)');
  }catch(err){
    showAlert('Catalyst PDF error: ' + (err && err.message ? err.message : err), 'danger');
    console.error(err);
  }
}

// Extract the 6 header fields from PDF text lines (works for both the text layer
// and OCR output) and auto-fill whichever entry fields are still blank.
function _catApplyPdfFields(lines, source){
  window.__catPdfLines = lines;
  const ALNUM = /([A-Za-z]{0,4}\d[A-Za-z0-9][A-Za-z0-9\-\/]*)/;  // SYL576420-91 / SRY9402
  const NUM   = /(\d{3,})/;                                       // numeric-only token
  const get = (labels, re) => _catGrab(lines, labels, re);
  let bol        = get([/bill\s*of\s*lading\s*(?:no\.?|number|#)?\s*:?/i, /\bBOL\b\s*#?\s*:?/i], ALNUM);
  { let __bp=''; for(const __l of lines){ const __m=String(__l).match(/\b([A-Za-z]{2,4}\d{4,}-\d+)\b/); if(__m){ __bp=__m[1]; break; } } if(__bp) bol=__bp; }
  const delivery = get([/delivery\s*note\s*(?:no\.?|number|#)?\s*:?/i, /delivery\s*(?:no\.?|number|#)\s*:?/i], NUM);
  const carTrail = get([/car\s*\/?\s*trailer\s*#?\s*:?/i, /\btrailer\s*#?\s*:?/i], ALNUM);
  const outbound = get([/outbound\s*order\s*(?:no\.?|number|#)?\s*:?/i], NUM);
  const custOrd  = get([/cust\.?\s*order\s*(?:no\.?|number|#)?\s*:?/i, /customer\s*order\s*(?:no\.?|#)?\s*:?/i], NUM);
  const shipNum  = get([/\bshipment\b\s*:?/i], NUM);
  const fill = (id, val, label) => { const el=document.getElementById(id); if (el && val && !el.value){ el.value=val; return label+' = '+val; } return ''; };
  const msg = [
    fill('cat-receiver',  bol,      'Receiver (BOL #)'),
    fill('cat-invoice',   delivery, 'Invoice (Delivery Note)'),
    fill('cat-railcar',   carTrail, 'Rail Car (Car/Trailer #)'),
    fill('cat-outbound',  outbound, 'Outbound Order'),
    fill('cat-custorder', custOrd,  'Cust Order'),
    fill('cat-shipment',  shipNum || (bol?_catShipFromBol(bol):''), 'Shipment')
  ].filter(Boolean);
  // Auto-detect the weight unit from the document: Catalyst normally ships in KG
  // ("... KG Gross"); XDK loads print in LB and must NOT be KG-converted.
  try {
    const __wu = (lines||[]).join('  ');
    const __kg = /\bKG\b\s*Gross/i.test(__wu);
    const __lb = /\bLB(?:S)?\b\s*Gross/i.test(__wu);
    const __kgEl = document.getElementById('cat-iskg');
    if (__kgEl && (__kg !== __lb)) { __kgEl.checked = __kg; msg.push('Weight = ' + (__kg ? 'KG → auto-checked' : 'LBS → KG unchecked (XDK)')); }
  } catch(e){}
  try{ window.__catConsignee = _catGrabConsignee(lines)||''; window.__catOrderNo = _catGrabOrderNo(lines)||''; }catch(e){}
  if (msg.length) showAlert('\u2713 ' + source + ' read \u2014 filled ' + msg.join('  \u00b7  '), 'success');
  else { showAlert(source + ': none of the expected labels were found \u2014 enter Outbound Order # and Rail Car # manually. (text logged to console)', 'warning'); console.log('Catalyst PDF text:', lines); }
  return msg.length;
}

// Lazy-load the OCR engine (tesseract.js). One-time ~download, then cached.
// Race a promise against a timeout so OCR can never hang the merge silently.
function _catTimeout(promise, ms, label){
  let t; const timer = new Promise((_,rej)=>{ t=setTimeout(()=>rej(new Error((label||'step')+' timed out after '+Math.round(ms/1000)+'s (engine likely blocked by your network)')), ms); });
  return Promise.race([promise, timer]).finally(()=>clearTimeout(t));
}

// Lazy-load the OCR engine (tesseract.js). One-time ~download, then cached.
// Surfaces load/download progress to the alert bar + console so a blocked CDN or
// a slow first-run download is visible instead of silently hanging.
async function _catEnsureTesseract(){
  if (window.__catTessWorker) return window.__catTessWorker;
  if (!window.Tesseract){
    await new Promise((res,rej)=>{
      const sc=document.createElement('script');
      sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
      sc.onload=res;
      sc.onerror=()=>rej(new Error('OCR engine script blocked \u2014 your network is blocking cdn.jsdelivr.net. Enter Outbound # manually.'));
      document.head.appendChild(sc);
    });
  }
  let last='';
  window.__catTessWorker = await window.Tesseract.createWorker('eng', 1, {
    logger: m => { try { if(m&&m.status){ const p=(m.progress!=null)?(' '+Math.round(m.progress*100)+'%'):''; if(m.status!==last){ last=m.status; console.log('[OCR] '+m.status+p); } if(/(load|download|initial|fetch)/i.test(m.status)) showAlert('OCR engine \u2014 '+m.status+p+'\u2026', 'info'); } } catch(e){} }
  });
  return window.__catTessWorker;
}

// OCR page 1: render via pdf.js, try the four orientations, keep the one whose
// text contains the most expected labels.
async function _catOcrPdf(buf){
  const pdfjsLib = await ensurePdfJs();
  const worker = await _catTimeout(_catEnsureTesseract(), 120000, 'OCR engine load');
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
  const page = await pdf.getPage(1);
  let best = { hits:-1, text:'' };
  for (const rot of [90, 270, 0, 180]){
    const vp = page.getViewport({ scale: 2, rotation: rot });
    const cv = document.createElement('canvas');
    cv.width = Math.ceil(vp.width); cv.height = Math.ceil(vp.height);
    await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
    let text = '';
    try { const r = await worker.recognize(cv); text = (r && r.data && r.data.text) || ''; } catch(e){ text=''; }
    const hits = ['Outbound','Trailer','Lading','Delivery','Shipment','Cust'].filter(k=>text.indexOf(k)>=0).length;
    if (hits > best.hits) best = { hits, text };
    if (hits >= 4) break;
  }
  return best.text.split('\n').map(l=>l.trim()).filter(Boolean);
}

// Blank-page detector so multi-page OCR skips the interleaved blank sheets.
function _catCanvasBlank(cv){
  try{
    const ctx=cv.getContext('2d'), w=cv.width, h=cv.height;
    const d=ctx.getImageData(0,0,w,h).data; let dark=0;
    for(let i=0;i<d.length;i+=4*37){ if(d[i]<190||d[i+1]<190||d[i+2]<190) dark++; }
    return dark < 25;
  }catch(e){ return false; }
}

// OCR EVERY page (page 1 rotation-detected; rest at that rotation, blanks skipped).
// The roll table + kg/lb-gross line live on the last content page, not page 1.
async function _catOcrPdfMulti(buf){
  const pdfjsLib = await ensurePdfJs();
  const worker = await _catTimeout(_catEnsureTesseract(), 120000, 'OCR engine load');
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
  const N = pdf.numPages||1;
  const KW=['Outbound','Trailer','Lading','Delivery','Shipment','Cust','SUBTOTAL','Roll','SKU'];
  const hitCount=t=>KW.filter(k=>t.indexOf(k)>=0).length;
  const canvasAt=async(page,rot,scale)=>{ const vp=page.getViewport({scale,rotation:rot}); const cv=document.createElement('canvas'); cv.width=Math.ceil(vp.width); cv.height=Math.ceil(vp.height); await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise; return cv; };
  const ocr=async cv=>{ try{ const r=await worker.recognize(cv); return (r&&r.data&&r.data.text)||''; }catch(e){ return ''; } };

  // 1) Detect orientation on page 1 with a FAST low-res pass (not 4 full-res OCRs).
  const p1 = await pdf.getPage(1);
  let bestRot=0, bestHits=-1;
  for (const rot of [0,90,270,180]){
    const t = await ocr(await canvasAt(p1, rot, 1.3));
    const h = hitCount(t);
    if (h>bestHits){ bestHits=h; bestRot=rot; }
    if (h>=4) break;
  }
  // 2) Header: OCR page 1 once at full res in the chosen orientation.
  const headerLines = String(await ocr(await canvasAt(p1, bestRot, 2))).split('\n').map(l=>l.trim()).filter(Boolean);
  let allLines = headerLines.slice();

  // 3) Roll table: walk from the LAST page backward, skip blanks, OCR content pages,
  //    and stop once the page holding the 'SKU:' roll-table start is read. This reads
  //    only page 1 + the roll-table page(s) \u2014 the schedule page is never OCR'd.
  const rollLines=[];
  for (let p=N; p>=2; p--){
    const page = await pdf.getPage(p);
    if (_catCanvasBlank(await canvasAt(page, bestRot, 0.5))) continue;   // cheap blank check
    const txt = await ocr(await canvasAt(page, bestRot, 2));
    const lns = String(txt).split('\n').map(l=>l.trim()).filter(Boolean);
    for (let x=lns.length-1; x>=0; x--) rollLines.unshift(lns[x]);
    if (/SKU\s*:/i.test(txt)) break;   // reached the start of the roll table
  }
  allLines = allLines.concat(rollLines);
  return { headerLines, allLines };
}

// Parse the Catalyst roll table from OCR lines: SKU, width, unit (kg/lb gross),
// per-roll gross weights, and RECONCILE against the printed 'N Rolls / total gross'
// so a scanned load is never silently under-received.
function _catParsePdfRolls(lines){
  let sku='', widthCm=0, unit='', pCount=0, pTotal=0;
  for (const l of (lines||[])){
    let m=String(l).match(/SKU:\s*(\d+)\s*-.*?Width:\s*([\d.]+)\s*(cm|in)/i);
    if(m){ sku=m[1]; const wv=parseFloat(m[2]); widthCm=/in/i.test(m[3])?(wv/CAT_CM2IN):wv; }
    m=String(l).match(/(?:SUBTOTAL|TOTAL)\s+(?:ORDER|DELIVERY)\s+(\d+)\s+Rolls.*?([\d,]{3,})\s*([A-Za-z0-9]{1,3})\s*gross/i);
    if(m){ pCount=parseInt(m[1],10); pTotal=parseInt(m[2].replace(/,/g,''),10); unit=/k/i.test(m[3])?'KG':'LB'; }
  }
  let on=false; const rolls=[];
  for (const l of (lines||[])){
    if(/SKU:/i.test(l)){ on=true; continue; }
    if(/SUBTOTAL|TOTAL\s+DELIVERY/i.test(l)) on=false;
    if(!on) continue;
    if(/^\s*Label\s*No/i.test(l)) continue;
    let str=String(l), re=/\b([A-Z][A-Z0-9]{5,13})\s+(\d{1,3}(?:,\d{3})+|\d{3,5})\b/g, mm;
    while((mm=re.exec(str))){ const w=parseInt(String(mm[2]).replace(/,/g,''),10); if(w>=200&&w<=6000) rolls.push({lot:mm[1], weight:w}); }
  }
  const sum=rolls.reduce((s,r)=>s+r.weight,0);
  const reconciled=(pCount>0 && rolls.length===pCount && Math.abs(sum-pTotal)<=Math.max(2,Math.round(pTotal*0.001)));
  return { sku, widthCm, unit, rolls, pCount, pTotal, sum, reconciled };
}

function _catShipFromBol(bol){ return String(bol||'').replace(/^[A-Za-z\s]+/,'').replace(/[-\/].*$/,'').trim(); }

function processCatalystFile(file) {
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const __isCsv = /\.csv$/i.test(file.name);
      let wb;
      if (__isCsv){
        const __b = new Uint8Array(ev.target.result);
        let __txt;
        if (__b[0]===0xFF && __b[1]===0xFE) __txt = new TextDecoder('utf-16le').decode(__b);
        else if (__b[0]===0xFE && __b[1]===0xFF) __txt = new TextDecoder('utf-16be').decode(__b);
        else { let __n=0, __lim=Math.min(__b.length,4000); for(let __i=1;__i<__lim;__i+=2){ if(__b[__i]===0) __n++; } __txt = (__n > __lim*0.2) ? new TextDecoder('utf-16le').decode(__b) : new TextDecoder('utf-8').decode(__b); }
        wb = XLSX.read(__txt, {type:'string'});
      } else {
        wb = XLSX.read(ev.target.result, {type:'binary', cellDates:true});
      }
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, blankrows:false});

      // H section: BOL # (-> Receiver) and Delivery # (-> Invoice)
      let bolNum='', delNum='', hHdr=-1;
      for (let i=0;i<Math.min(rows.length,12);i++){
        const r=rows[i]||[];
        if (String(r[0]==null?'':r[0]).trim().toUpperCase()==='H' && _catFindCol(r,['bol'],{})>=0){ hHdr=i; break; }
      }
      if (hHdr>=0){
        const hh=rows[hHdr];
        const cBol=_catFindCol(hh,['bol'],{});
        const cDel=_catFindCol(hh,['delivery #','delivery#','delivery no','delivery'],{not:['date']});
        for (let i=hHdr+1;i<rows.length;i++){
          const t=String((rows[i]||[])[0]==null?'':(rows[i]||[])[0]).trim().toUpperCase();
          if (t==='H'){ const hd=rows[i]; if(cBol>=0) bolNum=String(hd[cBol]==null?'':hd[cBol]).trim(); if(cDel>=0) delNum=String(hd[cDel]==null?'':hd[cDel]).trim(); break; }
          if (t==='L') break;
        }
      }

      // L section: roll header + columns
      let hIdx=-1, cols=null;
      for (let i=0; i<Math.min(rows.length, 25); i++) {
        const hdr = rows[i]||[];
        const cRoll = _catFindCol(hdr, ['roll(s)','roll id','rollid','roll #','roll','lot#','lot','batch','reel'], {not:['per pkg','per package','rolls per']});
        if (cRoll === -1) continue;
        cols = {
          roll:   cRoll,
          weight: _catFindCol(hdr, ['gross wt kg','gross wt','gross weight','net wt','weight','wt','kgs','kg','lbs','lb'], {not:['pkg','per pkg','rolls per','customer','diam']}),
          width:  _catFindCol(hdr, ['width'], {not:['customer']}),
          lineal: _catFindCol(hdr, ['lineal','linear','length'], {}),
          pcs:    _catFindCol(hdr, ['rolls per pkg','rolls per','per pkg','pcs','pieces','qty','count'], {}),
          sku:    _catFindCol(hdr, ['sku'], {not:['customer']}),
          cust:   _catFindCol(hdr, ['customer order','cust order','cust. order'], {}),
          order:  _catFindCol(hdr, ['order #','order#','order no','order'], {not:['customer']})
        };
        if (cols.sku === -1) cols.sku = _catFindCol(hdr, ['material','item','product'], {not:['customer']});
        hIdx = i; break;
      }
      if (hIdx === -1) {
        const seen = (rows[0]||[]).concat(rows[1]||[],rows[2]||[]).map(c=>String(c==null?'':c).trim()).filter(Boolean).slice(0,20).join(' | ');
        showAlert('Catalyst: no roll-id column found. Headers seen: ' + (seen||'(none)'), 'danger');
        return;
      }
      const num = v => { const n = parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; };
      const isData = r => String((r||[])[0]==null?'':(r||[])[0]).trim().toUpperCase()!=='H';
      const dataRows = rows.slice(hIdx+1).filter(isData).map(r => ({
        roll:   String(r[cols.roll]==null?'':r[cols.roll]).trim(),
        weight: cols.weight>=0 ? num(r[cols.weight]) : 0,
        width:  cols.width>=0  ? num(r[cols.width])  : 0,
        lineal: cols.lineal>=0 ? num(r[cols.lineal]) : 0,
        pcsRaw: cols.pcs>=0    ? num(r[cols.pcs])    : 0,
        sku:    cols.sku>=0    ? String(r[cols.sku]==null?'':r[cols.sku]).trim() : '',
        cust:   cols.cust>=0   ? String(r[cols.cust]==null?'':r[cols.cust]).trim() : '',
        order:  cols.order>=0  ? String(r[cols.order]==null?'':r[cols.order]).trim() : ''
      })).filter(r => r.roll && !/^(total|totals|sum|grand)\b/i.test(r.roll));
      if (!dataRows.length) { showAlert('Catalyst: 0 data rows found below the header row.', 'warning'); return; }

      // Auto-fill the entry fields from the file (only when blank)
      const custOrder = (dataRows.find(r=>r.cust)||{}).cust || '';
      const orderNo = (dataRows.find(r=>r.order)||{}).order || '';
      const blank = id => !(((document.getElementById(id)||{}).value)||'').trim();
      const setIf = (id,val) => { const el=document.getElementById(id); if(el && !el.value && val) el.value=val; };
      const filled=[];
      if (bolNum){ if(blank('cat-receiver')) filled.push('Receiver'); setIf('cat-receiver',bolNum);
                   const sh=_catShipFromBol(bolNum); if(sh){ if(blank('cat-shipment')) filled.push('Shipment'); setIf('cat-shipment',sh); } }
      if (delNum){ if(blank('cat-invoice')) filled.push('Invoice'); setIf('cat-invoice',delNum); }
      if (custOrder){ if(blank('cat-custorder')) filled.push('Cust Order'); setIf('cat-custorder',custOrder); }

      // Snapshot the entry fields AFTER auto-fill
      const M = {
        shipment:  (((document.getElementById('cat-shipment')||{}).value)||'').trim(),
        outbound:  (((document.getElementById('cat-outbound')||{}).value)||'').trim(),
        custOrder: (((document.getElementById('cat-custorder')||{}).value)||'').trim(),
        railcar:   (((document.getElementById('cat-railcar')||{}).value)||'').trim(),
        receiver:  (((document.getElementById('cat-receiver')||{}).value)||'').trim(),
        invoice:   (((document.getElementById('cat-invoice')||{}).value)||'').trim(),
        isKg:      !!((document.getElementById('cat-iskg')||{}).checked)
      };

      // Bundling: asterisk parent + next child -> one line
      const lines = [];
      for (let i=0; i<dataRows.length;) {
        const r = dataRows[i];
        if (/\*/.test(r.roll) && i+1 < dataRows.length) {
          const c = dataRows[i+1];
          lines.push({ sku:r.sku, lot:r.roll, widthCm:r.width, linealCm:r.lineal, pcs:2, rawWeight:(r.weight+c.weight), bundled:true });
          i += 2;
        } else {
          lines.push({ sku:r.sku, lot:r.roll, widthCm:r.width, linealCm:r.lineal, pcs:1, rawWeight:r.weight, bundled:false });
          i += 1;
        }
      }
      const bundles = lines.filter(l=>l.bundled).length;
      const detected = ['roll','weight','width','lineal','sku'].filter(k=>cols[k]>=0);
      _catLoads.push({ fileName:file.name, manual:M, lines:lines, rollCount:dataRows.length, lineCount:lines.length, bundleCount:bundles, detected:detected, orderNo:orderNo });
      _ediSave();
      const fmsg = filled.length ? ('  \u00b7  auto-filled ' + filled.join(', ')) : '';
      showAlert('\u2713 Catalyst ' + file.name + ' \u2014 ' + dataRows.length + ' rolls \u2192 ' + lines.length + ' lines' + (bundles?(' ('+bundles+' bundled)'):'') + (M.isKg?' \u00b7 KG\u2192LBS':' \u00b7 LBS') + fmsg, 'success');
      renderCatalystLoads();
    } catch (err) {
      showAlert('Catalyst parse error: ' + (err && err.message ? err.message : err), 'danger');
      console.error(err);
    }
  };
  if (/\.csv$/i.test(file.name)) reader.readAsArrayBuffer(file); else reader.readAsBinaryString(file);
}

    aoa.push([ sku, prodId1, L.lot, prodId2, poNum, wt, wt, 'ROLLS', _catLFRow(L), L.pcs, _catWidthRow(L), todaySerial ]);

  for (let row=8; row<=range.e.r; row++){ const cell=ws[XLSX.utils.encode_cell({r:row,c:11})]; if(cell) cell.z='m/d/yy'; }
  XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
  const safe = String(ship||'CAT').replace(/[^\w\-]/g,'').substring(0,20);
  const rcs  = String(rc||'').replace(/[^\w\-]/g,'').substring(0,15);
  const fname = 'Catalyst_' + (__xdk?'XDK':'Import') + '_' + safe + (rcs?('_'+rcs):'') + '.xlsx';

  showAlert('\u2713 Exported ' + fname + (__xdk?' \u00b7 XDK email drafted':''), 'success');

// ===========================================================================
// CATALYST - MERGE: multiple BOLs on one rail car -> ONE inbound/export.
// Group by SYL-base (the BOL # before the "-"). Each roll keeps ITS OWN
// delivery's Prod ID 1 / Prod ID 2 / PO. Header Receiver = first SYL.
// Self-contained: does NOT touch the single-file easy route (_catLoads) or any
// other EDI segment. Reuses the same parse + bundling + OCR helpers.
// ===========================================================================
let _catMergeGroups = [];

function _catNormBol(bol){ const s=String(bol||''); const p=s.split('-'); const d=(p[0]||'').replace(/\D/g,''); const suf=(p[1]||'').replace(/[^0-9A-Za-z]/g,''); return d ? (d+'-'+suf) : s.replace(/\s+/g,'').toUpperCase(); }
function _catSylBase(bol){ const p=String(bol||'').split('-')[0]; const d=p.replace(/\D/g,''); return d ? ('SYL'+d) : p.trim(); }

function handleCatMergeDrop(e){ _catMergeRoute(Array.from((e.dataTransfer&&e.dataTransfer.files)||[])); }

// Parse one Catalyst delivery Excel/CSV -> delivery record (same H/L parse +
// bundling as the easy route, but RETURNED, not pushed to _catLoads).
function _catMergeParseExcel(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const __isCsv = /\.csv$/i.test(file.name);
        let wb;
        if (__isCsv){
          const __b = new Uint8Array(ev.target.result);
          let __txt;
          if (__b[0]===0xFF && __b[1]===0xFE) __txt = new TextDecoder('utf-16le').decode(__b);
          else if (__b[0]===0xFE && __b[1]===0xFF) __txt = new TextDecoder('utf-16be').decode(__b);
          else { let __n=0, __lim=Math.min(__b.length,4000); for(let __i=1;__i<__lim;__i+=2){ if(__b[__i]===0) __n++; } __txt = (__n > __lim*0.2) ? new TextDecoder('utf-16le').decode(__b) : new TextDecoder('utf-8').decode(__b); }
          wb = XLSX.read(__txt, {type:'string'});
        } else {
          wb = XLSX.read(ev.target.result, {type:'binary', cellDates:true});
        }
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, blankrows:false});
        let bolNum='', delNum='', hHdr=-1;
        for (let i=0;i<Math.min(rows.length,12);i++){
          const r=rows[i]||[];
          if (String(r[0]==null?'':r[0]).trim().toUpperCase()==='H' && _catFindCol(r,['bol'],{})>=0){ hHdr=i; break; }
        }
        if (hHdr>=0){
          const hh=rows[hHdr];
          const cBol=_catFindCol(hh,['bol'],{});
          const cDel=_catFindCol(hh,['delivery #','delivery#','delivery no','delivery'],{not:['date']});
          for (let i=hHdr+1;i<rows.length;i++){
            const t=String((rows[i]||[])[0]==null?'':(rows[i]||[])[0]).trim().toUpperCase();
            if (t==='H'){ const hd=rows[i]; if(cBol>=0) bolNum=String(hd[cBol]==null?'':hd[cBol]).trim(); if(cDel>=0) delNum=String(hd[cDel]==null?'':hd[cDel]).trim(); break; }
            if (t==='L') break;
          }
        }
        let hIdx=-1, cols=null;
        for (let i=0; i<Math.min(rows.length, 25); i++) {
          const hdr = rows[i]||[];
          const cRoll = _catFindCol(hdr, ['roll(s)','roll id','rollid','roll #','roll','lot#','lot','batch','reel'], {not:['per pkg','per package','rolls per']});
          if (cRoll === -1) continue;
          cols = {
            roll:   cRoll,
            weight: _catFindCol(hdr, ['gross wt kg','gross wt','gross weight','net wt','weight','wt','kgs','kg','lbs','lb'], {not:['pkg','per pkg','rolls per','customer','diam']}),
            width:  _catFindCol(hdr, ['width'], {not:['customer']}),
            lineal: _catFindCol(hdr, ['lineal','linear','length'], {}),
            pcs:    _catFindCol(hdr, ['rolls per pkg','rolls per','per pkg','pcs','pieces','qty','count'], {}),
            sku:    _catFindCol(hdr, ['sku'], {not:['customer']}),
            cust:   _catFindCol(hdr, ['customer order','cust order','cust. order'], {}),
            order:  _catFindCol(hdr, ['order #','order#','order no','order'], {not:['customer']})
          };
          if (cols.sku === -1) cols.sku = _catFindCol(hdr, ['material','item','product'], {not:['customer']});
          hIdx = i; break;
        }
        if (hIdx === -1){ resolve({error:'no roll-id column found', fileName:file.name}); return; }
        const num = v => { const n = parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; };
        const isData = r => String((r||[])[0]==null?'':(r||[])[0]).trim().toUpperCase()!=='H';
        const dataRows = rows.slice(hIdx+1).filter(isData).map(r => ({
          roll:   String(r[cols.roll]==null?'':r[cols.roll]).trim(),
          weight: cols.weight>=0 ? num(r[cols.weight]) : 0,
          width:  cols.width>=0  ? num(r[cols.width])  : 0,
          lineal: cols.lineal>=0 ? num(r[cols.lineal]) : 0,
          sku:    cols.sku>=0    ? String(r[cols.sku]==null?'':r[cols.sku]).trim() : '',
          cust:   cols.cust>=0   ? String(r[cols.cust]==null?'':r[cols.cust]).trim() : '',
          order:  cols.order>=0  ? String(r[cols.order]==null?'':r[cols.order]).trim() : ''
        })).filter(r => r.roll && !/^(total|totals|sum|grand)\b/i.test(r.roll));
        if (!dataRows.length){ resolve({error:'0 data rows below header', fileName:file.name}); return; }
        const custOrder = (dataRows.find(r=>r.cust)||{}).cust || '';
        const orderNo = (dataRows.find(r=>r.order)||{}).order || '';
        const lines = [];
        for (let i=0; i<dataRows.length;){
          const r = dataRows[i];
          if (/\*/.test(r.roll) && i+1 < dataRows.length){
            const c = dataRows[i+1];
            lines.push({ sku:r.sku, lot:r.roll, widthCm:r.width, linealCm:r.lineal, pcs:2, rawWeight:(r.weight+c.weight), bundled:true });
            i += 2;
          } else {
            lines.push({ sku:r.sku, lot:r.roll, widthCm:r.width, linealCm:r.lineal, pcs:1, rawWeight:r.weight, bundled:false });
            i += 1;
          }
        }
        resolve({
          fileName:file.name, bol:bolNum, sylBase:_catSylBase(bolNum), delivery:delNum, orderNo:orderNo, consignee:'',
          custOrder:custOrder, shipment:_catShipFromBol(bolNum), outbound:'', railcar:'',
          lines:lines, rollCount:dataRows.length, physRolls:lines.reduce((s,l)=>s+l.pcs,0),
          bundleCount:lines.filter(l=>l.bundled).length
        });
      } catch(err){ resolve({error:(err&&err.message)||String(err), fileName:file.name}); }
    };
    if (/\.csv$/i.test(file.name)) reader.readAsArrayBuffer(file); else reader.readAsBinaryString(file);
  });
}

// OCR (or text layer) one BOL PDF -> {bol, delivery, outbound, railcar, shipment}.
async function _catMergeReadPdf(file){
  let lines = [];
  try { lines = await trExtractPdfLines(await file.arrayBuffer()); } catch(e){ lines=[]; }
  if (!lines || !lines.length){ const _mr = await _catOcrPdfMulti(await file.arrayBuffer()); lines = (_mr && _mr.allLines) || []; }  // OCR all pages (rolls live past page 1)
  if (!lines || !lines.length) return null;
  console.log('[Catalyst Merge] text read from '+file.name+':\n'+lines.join('\n'));
  const ALNUM = /([A-Za-z]{0,4}\d[A-Za-z0-9][A-Za-z0-9\-\/]*)/;
  const NUM   = /(\d{3,})/;
  const g = (labels, re) => _catGrab(lines, labels, re);
  const out = {
    bol:      g([/bill\s*of\s*lading\s*(?:no\.?|number|#)?\s*:?/i, /\bBOL\b\s*#?\s*:?/i], ALNUM),
    delivery: g([/delivery\s*note\s*(?:no\.?|number|#)?\s*:?/i, /delivery\s*(?:no\.?|number|#)\s*:?/i], NUM),
    railcar:  g([/car\s*\/?\s*trailer\s*#?\s*:?/i, /\btrailer\s*#?\s*:?/i], ALNUM),
    outbound: g([/outbound\s*order\s*(?:no\.?|number|#)?\s*:?/i], NUM),
    shipment: g([/\bshipment\b\s*:?/i], NUM),
    unit:     (/\bKG\b\s*Gross/i.test(lines.join('  ')) ? 'KG' : (/\bLB(?:S)?\b\s*[Gg]ross/i.test(lines.join('  ')) ? 'LB' : '')),
    consignee: _catGrabConsignee(lines),
    orderNo:  _catGrabOrderNo(lines),
    custOrder: _catGrab(lines, [/cust\.?\s*order\s*(?:no\.?|number|#)?\s*:?/i], NUM)
  };
  { let __bp=''; for(const __l of lines){ const __m=String(__l).match(/\b([A-Za-z]{2,4}\d{4,}-\d+)\b/); if(__m){ __bp=__m[1]; break; } } if(__bp) out.bol=__bp; }
  const _ri = _catParsePdfRolls(lines);
  out.rolls=_ri.rolls; out.sku=_ri.sku; out.widthCm=_ri.widthCm; out.pCount=_ri.pCount; out.pTotal=_ri.pTotal; out.rollSum=_ri.sum; out.reconciled=_ri.reconciled;
  if(_ri.unit) out.unit=_ri.unit;
  console.log('[Catalyst Merge] extracted from '+file.name+':', JSON.stringify(out));
  return out;
}

// Robust PDF->delivery matcher. OCR commonly corrupts the MIDDLE digits of the
// delivery # and the rail-car #, but the BOL suffix and trailing digits usually
// survive, so we fall through progressively looser keys.
function _catMatchDelivery(info, dels){
  const norm = s => String(s||'').replace(/\s+/g,'').toUpperCase();
  const suffix = s => { const m=norm(s).match(/-([A-Z0-9]+)$/); return m?m[1]:''; };
  const digits = s => String(s||'').replace(/\D/g,'');
  let hit = dels.find(d=> info.delivery && norm(d.delivery)===norm(info.delivery)); if(hit) return hit;
  hit = dels.find(d=> info.bol && norm(d.bol)===norm(info.bol)); if(hit) return hit;
  const psuf = suffix(info.bol);
  if (psuf){ hit = dels.find(d=> suffix(d.bol)===psuf); if(hit) return hit; }
  const pl2 = digits(info.delivery).slice(-2);
  if (pl2){ let c=dels.filter(d=> digits(d.delivery).slice(-2)===pl2); if(c.length===1) return c[0];
            c=dels.filter(d=> suffix(d.bol)===pl2); if(c.length===1) return c[0]; }
  const pn = digits(info.delivery);
  if (pn){ let best=null,bd=99; dels.forEach(d=>{ const dn=digits(d.delivery); if(dn.length===pn.length){ let diff=0; for(let i=0;i<dn.length;i++) if(dn[i]!==pn[i])diff++; if(diff<bd){bd=diff;best=d;} } }); if(best && bd<=2) return best; }
  return null;
}

async function _catMergeRoute(files){
  const list = Array.from(files||[]);
  const pdfs = list.filter(f=>/\.pdf$/i.test(f.name));
  const xls  = list.filter(f=>/\.(xls[xmb]?|csv)$/i.test(f.name));
  if (!xls.length && !pdfs.length){ showAlert('Merge: drop the delivery Excels and/or the BOL PDFs.', 'warning'); return; }
  showAlert('Merge: reading '+xls.length+' Excel'+(xls.length===1?'':'s')+(pdfs.length?(' + '+pdfs.length+' PDF'+(pdfs.length===1?'':'s')):'')+'\u2026', 'info');
  const isKg = !!((document.getElementById('cat-merge-iskg')||{}).checked);
  // 1) Parse this drop's Excels and add them to groups FIRST.
  const parsed = [];
  for (const f of xls){ const d = await _catMergeParseExcel(f); if (d.error){ showAlert('Merge: '+f.name+' \u2014 '+d.error, 'danger'); continue; } d.isKg=isKg; parsed.push(d); }
  parsed.forEach(d=>{
    let grp = _catMergeGroups.find(G=>G.sylBase===d.sylBase);
    if (!grp){ grp = { sylBase:d.sylBase, railcar:'', isKg:isKg, deliveries:[] }; _catMergeGroups.push(grp); }
    if (!grp.deliveries.some(x=>_catNormBol(x.bol)===_catNormBol(d.bol) || (d.delivery && String(x.delivery)===String(d.delivery)))) grp.deliveries.push(d);
  });
  renderCatMerge();
  // 2) OCR each PDF and attach to a delivery across ALL groups (so PDFs dropped in
  //    a separate batch still match deliveries already on screen).
  const allDel = _catMergeGroups.reduce((a,g)=>a.concat(g.deliveries),[]);
  let ocrFilled=0, pdfMiss=0;
  if (pdfs.length && !allDel.length){ showAlert('Merge: drop the delivery Excels too \u2014 a PDF on its own has nothing to attach its Outbound # to.', 'warning'); }
  if (pdfs.length) showAlert('Merge: reading '+pdfs.length+' BOL PDF'+(pdfs.length===1?'':'s')+' \u2014 image PDFs need OCR; the first run downloads the engine (~15MB) and can take up to a minute\u2026', 'info');
  for (const f of pdfs){
    let info=null;
    try { info = await _catMergeReadPdf(f); }
    catch(err){ showAlert('Merge: '+f.name+' \u2014 '+((err&&err.message)||err), 'danger'); console.error('[Catalyst Merge]', f.name, err); pdfMiss++; continue; }
    if (!info){ showAlert('Merge: OCR read no text from '+f.name+' \u2014 type its Outbound # in the table. (text logged to console)', 'warning'); pdfMiss++; continue; }
    let m = _catMatchDelivery(info, allDel);
    if (m && info.rolls && info.rolls.length && info.reconciled){ const __nz=x=>String(x||'').replace(/\s+/g,'').toUpperCase(); const __exact=(info.bol && _catNormBol(m.bol)===_catNormBol(info.bol)) || (info.delivery && __nz(m.delivery)===__nz(info.delivery)); if(!__exact) m=null; }
    if (m){ if(info.outbound){ m.outbound=info.outbound; ocrFilled++; } if(info.railcar) m._ocrRail=info.railcar; if(info.shipment && !m.shipment) m.shipment=info.shipment; if(info.unit) m.isKg=(info.unit==='KG'); if(info.consignee && !m.consignee) m.consignee=info.consignee; if(info.orderNo) m.orderNo=info.orderNo; renderCatMerge(); }
    else if (info.rolls && info.rolls.length && info.reconciled){
      const __cbol = (/^\d+-/.test(_catNormBol(info.bol)) ? ('SYL'+_catNormBol(info.bol)) : info.bol);
      const nd = { fileName:f.name, bol:__cbol, sylBase:_catSylBase(info.bol), delivery:info.delivery||'',
        orderNo:info.orderNo||'', consignee:info.consignee||'', custOrder:info.custOrder||'',
        shipment:_catShipFromBol(info.bol)||info.shipment||'', outbound:info.outbound||'', railcar:'',
        isKg:(info.unit!=='LB'), _ocrRail:info.railcar||'', _fromPdf:true,
        lines: info.rolls.map(r=>({ sku:info.sku||'', lot:r.lot, widthCm:info.widthCm||0, linealCm:0, pcs:1, rawWeight:r.weight, bundled:false })),
        rollCount:info.rolls.length, physRolls:info.rolls.length, bundleCount:0 };
      let grp=_catMergeGroups.find(G=>G.sylBase===nd.sylBase);
      if(!grp){ grp={ sylBase:nd.sylBase, railcar:'', isKg:isKg, deliveries:[] }; _catMergeGroups.push(grp); }
      if(!grp.deliveries.some(x=>_catNormBol(x.bol)===_catNormBol(nd.bol) || (nd.delivery && String(x.delivery)===String(nd.delivery)))){ grp.deliveries.push(nd); allDel.push(nd); ocrFilled++; }
      showAlert('\u2713 Merge: built load from '+f.name+' \u2014 '+nd.lines.length+' rolls \u00b7 '+info.rollSum+' '+(info.unit||'')+' \u00b7 '+(info.unit==='LB'?'XDK':'REG')+' \u00b7 reconciled to printed total.', 'success');
      renderCatMerge();
    }
    else if (info.rolls && info.rolls.length && !info.reconciled){
      showAlert('Merge: '+f.name+' \u2014 OCR read '+info.rolls.length+'/'+(info.pCount||'?')+' rolls ('+info.rollSum+'/'+(info.pTotal||'?')+' '+(info.unit||'')+') but it does NOT reconcile to the printed total \u2014 no load created. Re-scan clearer or drop the delivery CSV.', 'danger'); pdfMiss++;
    }
    else { showAlert('Merge: '+f.name+' (delivery '+(info.delivery||'?')+' / BOL '+(info.bol||'?')+') matched no delivery and no roll table found \u2014 drop the delivery CSV or type the Outbound # manually.', 'warning'); pdfMiss++; }
  }
  // 3) Group rail car = the modal OCR rail-car among its deliveries (OCR noise -> majority wins). Only when blank.
  _catMergeGroups.forEach(grp=>{
    if (!grp.railcar){
      const tally={};
      grp.deliveries.forEach(d=>{ if(d._ocrRail){ const k=d._ocrRail.toUpperCase(); tally[k]=(tally[k]||0)+1; } });
      let bestK='', bestN=0; Object.keys(tally).forEach(k=>{ if(tally[k]>bestN){bestN=tally[k];bestK=k;} });
      if (bestK) grp.railcar=bestK;
    }
    grp.deliveries.sort((a,b)=> String(a.bol).localeCompare(String(b.bol), undefined, {numeric:true}));
  });
  const totalDel = _catMergeGroups.reduce((s,g)=>s+g.deliveries.length,0);
  const totalRolls = _catMergeGroups.reduce((s,g)=>s+g.deliveries.reduce((a,d)=>a+d.physRolls,0),0);
  let msg = '\u2713 Merge: '+totalDel+' deliver'+(totalDel===1?'y':'ies')+' in '+_catMergeGroups.length+' group'+(_catMergeGroups.length===1?'':'s')+' \u00b7 '+totalRolls+' rolls';
  if (pdfs.length) msg += ' \u00b7 OCR filled '+ocrFilled+'/'+pdfs.length+' Outbound #'+(pdfMiss?(' \u00b7 '+pdfMiss+' need manual entry'):'');
  msg += '. Verify Outbound # & Rail Car, then Export.';
  showAlert(msg, (ocrFilled||totalDel)?'success':'warning');
  renderCatMerge();
}

function _catMergeSet(gi, di, field, val){
  const grp=_catMergeGroups[gi]; if(!grp) return;
  if (field==='railcar'){ grp.railcar=val.trim(); return; }
  const d=grp.deliveries[di]; if(!d) return;
  d[field]=val.trim();
}

function _catMergeToggleUnit(gi, di){
  const grp=_catMergeGroups[gi]; if(!grp) return;
  const d=grp.deliveries[di]; if(!d) return;
  d.isKg = (d.isKg===false);
  renderCatMerge();
}

function _catMergeDelDelivery(gi, di){
  const grp=_catMergeGroups[gi]; if(!grp) return;
  grp.deliveries.splice(di,1);
  if(!grp.deliveries.length) _catMergeGroups.splice(gi,1);
  renderCatMerge();
}

// Best-effort Final Consignee / Destination from BOL PDF text (editable in the
// mailto draft afterward, so imperfect column-order extraction is acceptable).
function _catGrabConsignee(lines){
  const arr = (lines||[]).map(l=>String(l||'').trim());
  const i = arr.findIndex(l => /final\s*consignee|consignee\s*\/?\s*destination/i.test(l));
  // consignee number from the label line
  let num=''; if(i>=0){ const hl=arr[i]; let mm=hl.match(/(\d{3,})\s*$/); if(!mm){ const c=hl.lastIndexOf(':'); mm=(c>=0?hl.slice(c+1):hl).match(/(\d{3,})/); } if(mm) num=mm[1]; }
  const HARD=/we\s+are\s+chain|conditions?\s+of\s+carriage|customer\s+delivery|goods\s+received|carrier\s*bills|subtotal|total\s+delivery|inbound\s*order|outbound\s*order|please\s+notify|^\s*stop\s*\d/i;
  const LABEL=/\s:\s|:\s*$|@|^\s*(?:contact|delivery\s+day|delivery\s+date|deliver|origin|destination|routing|carrier|freight|booking|ship\s*to|sold\s*to|marks|shipping|rail\s*contact|phone|order\s*no|cust|customer|outbound|inbound|vessel|estimated|seal|bill\s*of|shipment|date\s+shipped|note|final\s*consignee)\b|please\s+contact|representative|confirm\s+this|chain\s+of\s+custody|inside\s+sales|www\.|http/i;
  const STREET=/\d{1,6}\s+[A-Za-z0-9].*(?:blvd|boulevard|street|\bst\b|avenue|\bave\b|road|\brd\b|drive|\bdr\b|lane|\bln\b|\bway\b|pkwy|parkway|hwy|highway|industrial|court|\bct\b|circle|\bcir\b|suite|\bste\b|\bunit\b|place|\bpl\b|terrace|trail)/i;
  const CITYZIP=/[A-Za-z][A-Za-z .'\-]+\s+[A-Z]{2}\s+\d{5}(?:-\d{4})?\b/;
  // our own DCs / Catalyst origin \u2014 never the XDK customer, so exclude
  const OWN=/piper|greensboro|\bfulton\b|catalyst|richmond|lysander|surrey|1c3|30336|30331|british\s+columbia|\bv7b\b/i;
  let name='', street='', city='';
  // Strategy A: component scan in a window after the consignee label
  const start2 = i>=0 ? i+1 : 0, end2 = Math.min(arr.length, (i>=0? i : 0) + 22);
  for (let k2=start2; k2<end2; k2++){
    const raw=arr[k2]; if(!raw) continue;
    if(HARD.test(raw)) break;
    if(LABEL.test(raw)) continue;
    const clean=raw.replace(/^[^A-Za-z0-9]+/,'').replace(/\s{2,}/g,' ').trim();
    if(!clean) continue;
    if(!city){ const cm=clean.match(CITYZIP); if(cm && !OWN.test(cm[0])){ city=cm[0]; continue; } }
    if(!street && STREET.test(clean) && !OWN.test(clean)){ street=clean; continue; }
    if(!name && /[A-Za-z]{3,}/.test(clean) && !/\d{3,}/.test(clean) && !OWN.test(clean)){ name=clean; continue; }
    if(name && street && city) break;
  }
  // Strategy B: name from the 'Marks : NAME / PO#' line if not found in the box
  if(!name){ const mk=arr.find(l=>/marks\s*:/i.test(l)); if(mk){ const mm=mk.replace(/.*marks\s*:/i,'').split(/[\/,]/)[0].trim(); if(mm && /[A-Za-z]{3,}/.test(mm) && !OWN.test(mm)) name=mm; } }
  // Strategy C: street / city anywhere on the page (non-own) if still missing
  if(!street){ for(const l of arr){ const c=String(l).replace(/^[^A-Za-z0-9]+/,'').trim(); if(STREET.test(c) && !OWN.test(c)){ street=c; break; } } }
  if(!city){ for(const l of arr){ const cm=String(l).match(CITYZIP); if(cm && !OWN.test(cm[0])){ city=cm[0]; break; } } }
  return [num, name, street, city].filter(Boolean).join(', ');
}

// Option A: open a pre-filled XDK notification email (mailto draft) to the
// editable "XDK notify" recipients. Order Details = Order No + ' ' + Cust Order
// No; Shipping Point = Final Consignee/Destination; Total Loads = lb / 42,000.
function _catXdkEmail(railcar, dels){
  const to = (((document.getElementById('cat-xdk-notify')||{}).value)||'').trim();
  const totalLb = dels.reduce((s,d)=> s + d.lines.reduce((a,L)=>a+(L.rawWeight||0),0), 0);
  const loads = Math.max(1, Math.ceil(totalLb/42000));
  const B = [];
  B.push('XDK inbound received \u2014 details below.');
  B.push('');
  B.push('Rail Car: ' + (railcar||''));
  dels.forEach(d=>{
    const wt = d.lines.reduce((a,L)=>a+(L.rawWeight||0),0);
    B.push('');
    B.push('Order Details: ' + ((d.orderNo||'') + ' ' + (d.custOrder||'')).trim());
    B.push('Shipping Point: ' + (d.consignee||'(confirm final consignee/destination on paperwork)'));
    B.push('BOL ' + (d.bol||'') + '  \u00b7  Delivery ' + (d.delivery||'') + '  \u00b7  ' + Math.round(wt).toLocaleString() + ' lb');
  });
  B.push('');
  B.push('Total Weight: ' + Math.round(totalLb).toLocaleString() + ' lb');
  B.push('Total Loads (\u00f7 42,000 lb/truckload): ' + loads);
  B.push('');
  B.push('\u2014 Auto-generated by PickFlow 6021');
  const __oo = dels.map(function(d){ return String(d.outbound||d.orderNo||'').trim(); }).filter(Boolean);
  const __nm = (function(c){ return String(c||'').split(',').map(function(x){return x.trim();}).find(function(x){ return x && !/^[\d\s\-]+$/.test(x) && !/\d{5}/.test(x) && !/^\d/.test(x) && !/\b(?:blvd|boulevard|street|avenue|road|drive|lane|industrial|highway|parkway|suite|unit|st|rd|dr|ave|ln|way|pkwy|hwy|ste|court|ct)\b/i.test(x); }); })((dels[0]||{}).consignee) || '';
  const subject = 'XDK Outbound Order ' + (__oo.join(', ') || '(order #)') + (__nm ? (' \u2014 ' + __nm) : '');
  const href = 'mailto:' + to + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(B.join('\n'));
  const a = document.createElement('a'); a.href = href; a.style.display='none'; document.body.appendChild(a); a.click(); setTimeout(()=>{ try{a.remove();}catch(e){} },0);
}
function exportCatMergeGroup(gi){
  const grp=_catMergeGroups[gi]; if(!grp||!grp.deliveries.length){ showAlert('Nothing to export.', 'warning'); return; }
  const rc=(grp.railcar||'').trim();
  if(!rc){ showAlert('Merge: enter the Rail Car # for '+grp.sylBase+' before exporting.', 'danger'); return; }
  const missing=grp.deliveries.filter(d=>!(d.outbound||'').trim()).map(d=>d.bol);
  if(missing.length && !confirm('No Outbound Order # for: '+missing.join(', ')+'\nProd ID 2 will be incomplete for those rolls. Export anyway?')) return;

  // Split by weight unit: KG deliveries = REG, LB deliveries = XDK (SKU + "X", no KG conversion).
  const reg = grp.deliveries.filter(d => d.isKg !== false);
  const xdk = grp.deliveries.filter(d => d.isKg === false);
  const split = reg.length>0 && xdk.length>0;
  const today=new Date(), excelEpoch=new Date(1900,0,1);
  const todaySerial=Math.round((today-excelEpoch)/86400000)+1;

  const build = (dels, isXdk) => {
    const first=dels[0];
    const firstP1=(first.shipment+' '+(first.delivery||'')).trim();
    const headerPo=(rc+' '+firstP1).trim();
    const totalRolls=dels.reduce((s,d)=>s+d.physRolls,0);
    const aoa=[
      [''],
      ['Receiver', first.bol||'', '', 'Total Rolls', totalRolls, '', '', 'Fraction  Decimal'],
      ['PO #',     headerPo, '', '', '', '', '', 0.5, 0.5],
      ['Invoice #',first.delivery||''],
      ['Truck #',  rc, '', '', '', '', '', 'Piper IBD Order #'],
      [''],[''],
      ['SKU','Product ID','Lot#','Prod ID 2','PO#','Weight','Gross Weight','UOM','LF','Pcs','Width','Exp Date']
    ];
    dels.forEach(d=>{
      const wf=(d.isKg!==false)?CAT_KG2LB:1;
      const p1=(d.shipment+' '+(d.delivery||'')).trim();
      const p2=((d.custOrder||'')+' '+(d.outbound||'')).trim();
      const po=(rc+' '+p1).trim();
      d.lines.forEach(L=>{
        const wt=L.rawWeight*wf;
        const sku=(isXdk && L.sku) ? (L.sku+'X') : L.sku;
        aoa.push([ sku, p1, L.lot, p2, po, wt, wt, 'ROLLS', L.linealCm*CAT_CM2IN, L.pcs, L.widthCm*CAT_CM2IN, todaySerial ]);
      });
    });
    return aoa;
  };

  const writeAoa = (aoa, tag) => {
    const wb=XLSX.utils.book_new();
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    const range=XLSX.utils.decode_range(ws['!ref']);
    for(let row=8; row<=range.e.r; row++){ const cell=ws[XLSX.utils.encode_cell({r:row,c:11})]; if(cell) cell.z='m/d/yy'; }
    XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
    const safe=String(grp.sylBase||'CAT').replace(/[^\w\-]/g,'').substring(0,20);
    const rcs=String(rc||'').replace(/[^\w\-]/g,'').substring(0,15);
    const fname='Catalyst_'+tag+'_'+safe+(rcs?('_'+rcs):'')+'.xlsx';
    XLSX.writeFile(wb, fname);
    return fname;
  };

  const done=[];
  if (reg.length){ done.push(writeAoa(build(reg,false), split?'Merge_REG':'Merge')); }
  if (xdk.length){ done.push(writeAoa(build(xdk,true), 'XDK')); _catXdkEmail(rc, xdk); }
  const totalRolls=grp.deliveries.reduce((s,d)=>s+d.physRolls,0);
  showAlert('\u2713 Exported '+done.join(' + ')+' \u2014 '+grp.deliveries.length+' deliveries, '+totalRolls+' rolls'+(split?(' \u00b7 split REG('+reg.length+') + XDK('+xdk.length+') \u00b7 XDK email drafted'):(xdk.length?' \u00b7 XDK email drafted':'')), 'success');
}

// ---- Per-LOAD export: each delivery -> its own import file (REG or XDK). ----
// Same row/header format as EXPORT MERGED, but one file per delivery so mixed
// rail cars can be imported as separate inbounds.
function _catMergeAoa(rc, dels){
  const first=dels[0];
  const firstP1=(first.shipment+' '+(first.delivery||'')).trim();
  const headerPo=(rc+' '+firstP1).trim();
  const totalRolls=dels.reduce((s,d)=>s+d.physRolls,0);
  const today=new Date(), excelEpoch=new Date(1900,0,1);
  const todaySerial=Math.round((today-excelEpoch)/86400000)+1;
  const aoa=[
    [''],
    ['Receiver', first.bol||'', '', 'Total Rolls', totalRolls, '', '', 'Fraction  Decimal'],

// ─── HBH SKU CONVERSION ──────────────────────────────────────────────────────
// Width → attachment suffix mapping (SKU = material + "." + code).
// HBH_SKU_MAP holds the built-in DEFAULTS. The table is user-maintainable: import
// a spreadsheet to add/override width→code entries (persisted to Firebase at
// 6021/hbhWidthTable). Imported entries overlay these defaults, so an imported
// table that is missing an old width never breaks existing conversions.
const HBH_SKU_MAP = [
  [26,      '2600'],  [29.5,   '2950'],  [31,     '3100'],
  [33.875,  '3314'],  [36,     '3600'],  [38,     '3800'],
  [40,      '4000'],  [42,     '4200'],  [48.5,   '4850'],
  [50,      '5000'],  [50.125, '50125'], [50.25,  '5025'],
  [54,      '5400'],  [56,     '5600'],  [56.25,  '5625']
];

// Returns the effective width→code list: built-in defaults with any imported
// entries (from state/Firebase) layered on top. Imported entries are stored as a
// LIST of {w, code} records in Firebase — NOT keyed by width, because widths like
// "33.875" contain "." which Firebase forbids in keys. An imported entry whose
// width matches a default (within 0.001) overrides that default.
function getHbhWidthTable() {
  const merged = HBH_SKU_MAP.map(e => [e[0], e[1]]); // clone defaults
  const imported = (state && state.hbhWidthTable) ? state.hbhWidthTable : null;
  if (imported) {
    const records = Array.isArray(imported) ? imported : Object.values(imported);
    records.forEach(rec => {
      if (!rec || rec.w === undefined || rec.w === null) return;
      const w = parseFloat(rec.w);
      if (isNaN(w)) return;
      const code = (rec.code == null ? '' : rec.code).toString();
      const hit = merged.find(e => Math.abs(e[0] - w) < 0.001);
      if (hit) hit[1] = code;        // override matching default width
      else merged.push([w, code]);   // add a brand-new width
    });
  }
  return merged;
}

// Count of imported (non-default) mappings, handling array or object form.
function hbhImportedCount() {
  const imported = (state && state.hbhWidthTable) ? state.hbhWidthTable : null;
  if (!imported) return 0;
  return Array.isArray(imported) ? imported.length : Object.keys(imported).length;
}

function getHBHSku(material, width) {
  const w      = parseFloat(width) || 0;
  const entry  = getHbhWidthTable().find(([mw]) => Math.abs(mw - w) < 0.001);
  if (!entry || !material) return material || '';
  return material + '.' + entry[1];
}

// Import a Width → code table from a spreadsheet.
// Expected columns (row 1 = header, skipped): Import Width | New Width
function importHBHWidthTable(wb) {
  const ws   = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
  const records = [];
  rows.forEach((row, i) => {
    if (i === 0) return; // skip header
    const w    = parseFloat((row[0] || '').toString().trim());
    const code = (row[1] == null ? '' : row[1]).toString().trim();
    if (isNaN(w) || !code) return;
    records.push({ w: w, code: code });
  });
  if (!records.length) {
    showAlert('No width mappings found. Expected columns: Import Width | New Width', 'warning');
    return;
  }
  state.hbhWidthTable = records;
  if (db) {
    db.ref('6021/hbhWidthTable').set(records)
      .catch(err => showAlert('Loaded locally, but cloud sync failed: ' + err.message, 'warning'));
  }
  showAlert('✓ HBH width table loaded — ' + records.length + ' mapping(s). Re-drop your GS file to apply.', 'success');
  updateHBHWidthCount();
}

function handleHBHWidthFile(file) {
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const wb = XLSX.read(ev.target.result, {type:'binary'});

function downloadHBHWidthTemplate() {

  const el = document.getElementById('hbh-width-count');

    ? total + ' mappings (' + imported + ' imported + defaults)'

function processHBHFile(file) {
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      if (!state.dirData || Object.keys(state.dirData).length === 0) {
        showAlert('⚠ No data loaded yet — Product ID, Customer, Width, and SKU codes will be blank. Import or Preview your data file first, then re-drop the HBH file.', 'warning');
      }
      const wb = XLSX.read(ev.target.result, {type:'binary', raw:true});
      // Append to existing loads (support multiple file drops)
      const invByLot = {};
      state.inventory.forEach(r => { if (r.lot) invByLot[r.lot] = r; });

      const hbhPrefix = s => ('HBH ' + s).replace(/^HBH\s+HBH\s+/i, 'HBH ');
      const nz = v => (v == null ? '' : v.toString()).replace(/\u0000/g, '').trim(); // strip NUL bytes from raw file values

      wb.SheetNames.forEach(sn => {
        const ws   = wb.Sheets[sn];
        const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:true});
        if (!rows || !rows.length) return;

        const gsGroups = {};
        rows.forEach(r => {
          if (!r || !r[0]) return;
          const gsNum    = nz(r[0]);
          if (!gsNum) return;
          const wrdBatch = nz(r[6]);
          if (!wrdBatch) return;
          const batch    = wrdBatch.startsWith('WRD') ? '5' + wrdBatch.slice(3) : wrdBatch;
          const truck    = nz(r[1]);
          const stoDoc   = nz(r[18]).replace(/^0+/,'') || '';
          const stoItem  = nz(r[19]).replace(/^0+/,'') || '';
          const sto      = stoDoc + (stoItem ? '-'+stoItem : '');
          const weight   = parseFloat(r[9]) || 0;
          const lf       = parseFloat(r[12]) || 0;
          const skuFile  = nz(r[21]);
          const d        = state.dirData[batch] || {};
          const inv      = invByLot[batch] || {};
          // custName: strip leading "HBH " if already present
          const rawCust  = d.customerName || '';
          const custName = rawCust.replace(/^HBH\s+/i, '');

          if (!gsGroups[gsNum]) gsGroups[gsNum] = { gsNum, truck, rolls:[] };
          gsGroups[gsNum].rolls.push({
            batch, sto, weight, lf,
            sku:          getHBHSku(d.material || skuFile, d.width || 0),
            productId:    d.matDesc   || '',
            width:        d.width     || 0,
            expDate:      inv.expDate || null,
            custName
          });
        });

        Object.values(gsGroups).forEach(group => {
          group.rolls.sort((a,b) => a.batch.localeCompare(b.batch));
          const first      = group.rolls[0] || {};
          const invoiceRef = first.sto || '';
          const custName   = first.custName || '';

          _ediHBHLoads.push({
            sheetName: group.gsNum,
            receiver:  group.gsNum,
            truck:     group.truck,
            invoice:   invoiceRef,
            poLine:    'HBH ' + custName + ' ' + invoiceRef + ' ' + group.gsNum,
            col5hdr:   'STO',
            rows: group.rolls.map(r => ({
              sku:         r.sku,
              productId:   r.productId,
              lot:         r.batch,
              prodId2:     'HBH ' + r.custName + ' ' + r.sto,
              po5:         r.sto,
              weight:      r.weight,
              grossWeight: r.weight,
              uom:         'ROLLS',
              lf:          r.lf,
              pcs:         1,
              width:       r.width,
              expDate:     r.expDate
            }))
          });
        });
      });

      _ediSave();
      showAlert('✓ ' + _ediHBHLoads.length + ' HBH loads loaded from ' + file.name, 'success');
      showEDIImportFile();
    } catch(err) {
      showAlert('Error reading file: ' + err.message, 'danger');
    }
  };
  reader.readAsBinaryString(file);
}

function buildEDISheet_SciGames(group) {
  const lots      = group.lots;
  const rollCount = lots.length;

  // Helper: get PO# for a lot (purchDoc-purchItem, fallback to inv.po)
  const getLotPO = l => {
    // Use _pd/_pi (user-mapped columns) first, then purchDoc/purchItem, then inv.po
    const pd = l._pd || l.purchDoc || '';
    const pi = l._pi || l.purchItem || '';
    if (pd) return pd + (pi ? '-' + pi : '');
    return l.po || '';
  };

  // Receiver = Shipment Number
  const receiver = group.shipment || '';
  // Invoice # = invoiceRef (soDoc-soItem)
  const invoice  = group.invoiceRef || '';
  // Truck # = Vehicle ID from DIR, fallback to BOL
  const truck    = lots.find(l => l.vehicleId)?.vehicleId
                || lots.find(l => l.bol)?.bol || '';
  // PO # header = same value as line data PO# (first lot's PO)
  // PO # header = customer name + shipment + truck (reference line)
  const poLine   = group.customerName + ' ' + group.shipment + (truck ? ' ' + truck : '');

  const aoa = [
    // Row 1 — empty
    [],
    // Row 2 — A:Receiver, B:value, D:Total Rolls, E:count, H:Fraction Decimal
    ['Receiver', receiver, null, 'Total Rolls', rollCount, null, null, 'Fraction  Decimal'],
    // Row 3 — A:PO #, B:value, H:0.5, I:0.5
    ['PO #', poLine, null, null, null, null, null, 0.5, 0.5],
    // Row 4 — A:Invoice #, B:value
    ['Invoice #', invoice],
    // Row 5 — A:Truck #, B:value, H:Piper IBD Order #
    ['Truck #', truck, null, null, null, null, null, 'Piper IBD Order #'],
    // Row 6 — empty
    [],
    // Row 7 — empty
    [],
    // Row 8 — column headers
    ['SKU','Product ID','Lot#','Prod ID 2','PO#','Weight','Gross Weight','UOM','LF','Pcs','Width','Exp Date']
  ];

  // Exp Date = the date the file is exported (today), short date format — same for every row.
  // Build from the local calendar date (not time-of-day) so it never drifts a day.
  const _now = new Date();
  const fileDateSerial = Math.round(Date.UTC(_now.getFullYear(), _now.getMonth(), _now.getDate()) / 86400000) + 25569;
  lots.forEach(l => {
    const poNum     = getLotPO(l);
    const weight    = l.grossWt || 0;
    const lf        = l.qtyMlf ? +l.qtyMlf.toFixed(3) : 0;

    aoa.push([
      l.material,
      l.matDesc,
      l.lot,
      l.prod2 || ('Scientific Games ' + invoice),
      poNum,
      weight, weight,
      'ROLLS',
      lf, 1,
      l.width || 0,
      fileDateSerial || ''
    ]);
  });

  const ws = XLSX.utils.aoa_to_sheet(aoa);

  // Apply short date format (m/d/yyyy) to Exp Date column (col L = index 11)
  // Data rows start at row 9 (aoa index 8 = sheet row index 8, 0-based)
  const expColIdx = 11;
  for (let r = 8; r < aoa.length; r++) {
    const cellRef = XLSX.utils.encode_cell({ r, c: expColIdx });
    if (ws[cellRef] && ws[cellRef].v) {
      ws[cellRef].t = 'n';
      ws[cellRef].z = 'm/d/yyyy';
    }
  }

  return ws;
}
